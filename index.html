<style>
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --series: #2a78d6; --live: #006300;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --series: #3987e5; --live: #0ca30c;
  }
}
:root[data-theme="dark"] {
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --series: #3987e5; --live: #0ca30c;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1120px; margin: 0 auto; padding: 28px 16px 48px; }
h1 { font-size: 24px; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--ink-2); margin: 2px 0 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.venue { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
.venue:hover { border-color: var(--axis); transform: translateY(-1px); }
.venue:focus-visible { outline: 2px solid var(--series); outline-offset: 2px; }
.media { aspect-ratio: 4 / 3; background: var(--grid); position: relative; }
.media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.logo { width: 44px; height: 44px; border-radius: 50%; flex: none; position: relative; overflow: hidden; background: var(--grid); box-shadow: 0 0 0 3px var(--lv, var(--border)); display: grid; place-items: center; font-weight: 700; font-size: 14px; color: var(--ink-2); }
.logo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.14); } /* logos are screenshots with a dark margin: zoom past it */
.media .logo { position: absolute; right: 12px; bottom: -22px; box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--lv, var(--border)); }
.media { overflow: visible; }
.body { padding-top: 14px; }
.top { padding-right: 56px; }
.maplogo { background: none; border: 0; }
.maplogo .logo { width: 100%; height: 100%; box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--lv, #898781), 0 4px 12px rgba(0,0,0,.35); cursor: pointer; }
.media .none { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; border-bottom: 1px dashed var(--axis); }
.body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.name { font-weight: 600; font-size: 16px; }
.type { color: var(--muted); font-size: 12px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--axis); }
.status.live .dot { background: var(--live); }
.status.soon .dot { background: #eda100; }
.media .none.soon, .media .none { text-align: center; }
.stat { display: flex; align-items: baseline; gap: 6px; margin-top: auto; }
.stat b { font-size: 26px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--ink-2); font-size: 13px; }
.arrow { margin-left: auto; color: var(--muted); }
.tabs { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); margin-bottom: 16px; }
.tab { font: inherit; font-size: 13px; color: var(--ink-2); background: transparent; border: 0; border-radius: 7px; padding: 6px 14px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--grid); color: var(--ink); font-weight: 600; }
.mapwrap { position: relative; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface); }
#map { height: min(70vh, 620px); min-height: 360px; }
.legend { position: absolute; right: 12px; bottom: 12px; z-index: 500; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--ink-2); }
.legend .rows { display: grid; gap: 4px; margin-top: 6px; }
.venue { border-left: 4px solid var(--lv, var(--border)); }
.maphint { color: var(--muted); font-size: 12px; margin-top: 8px; }
.leaflet-tooltip.vlabel { background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); font: 12px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 4px 8px; }
.leaflet-tooltip.vlabel b { font-size: 14px; font-variant-numeric: tabular-nums; }
.leaflet-tooltip.vlabel::before { display: none; }
.leaflet-container { font: inherit; }
.heatcanvas { position: absolute; pointer-events: none; filter: blur(8px) saturate(1.15); transition: opacity .2s; }

.updated { color: var(--muted); font-size: 12px; border-top: 1px solid var(--grid); padding-top: 8px; }

<script>
const $ = id => document.getElementById(id);
const hm = ts => ts.slice(11, 16);

async function load() {
  const { venues } = await (await fetch(`data/venues.json?t=${Date.now()}`)).json();
  const now = new Date();
  const cards = await Promise.all(venues.map(withSettings).map(async v => {
    let latest = null, updatedAt = '', rising = false;
    if (v.simulated) {
      latest = simLatest(v, now);
      updatedAt = latest.timestamp;
      rising = risingSim(v, now);
    } else if (v.data) {
      const { frames, updated_at } = await (await fetch(`${v.data}?t=${Date.now()}`)).json();
      updatedAt = updated_at || '';
      // Same rule as the venue page: a frame counts only once its time has passed.
      const due = frames.filter(f => new Date(f.timestamp) <= now);
      latest = due[due.length - 1] || null;
      rising = risingFromFrames(due);
      // Today's frames (business day from 06:00) for the faint chart behind the card.
      const dayStart = new Date(now); dayStart.setHours(6, 0, 0, 0); if (dayStart > now) dayStart.setDate(dayStart.getDate() - 1);
      v.today = due.filter(f => new Date(f.timestamp) >= dayStart);
    }
    v.event = eventFor(v, now);
    const status = venueStatus(v, now);
    // At its peak replaces "getting busier" and the expected peak: it is already there.
    const peak = v.simulated && status.state !== 'closed' && atPeakSim(v, now);
    rising = rising && status.state !== 'closed' && !peak;
    // A venue's own `expected_peak` (venues.json, e.g. a booked night) wins over the demo forecast.
    const expected = peak ? null : v.expected_peak ?? (rising && v.simulated ? expectedPeak(v, now) : null);
    return { ...v, latest, updatedAt, status, rising, expected, peak };
  }));
  document.title = `${t('venues')} · ${t('occupancy')}`;
  $('subtitle').textContent = t('listSub', venues.length, now.toTimeString().slice(0, 5));
  lastCards = cards;
  // Colour bands follow how many people are out in total (see setLevelScale in levels.js).
  setLevelScale(cards.reduce((sum, c) => sum + (c.latest && c.status?.state !== 'closed' ? c.latest.people : 0), 0));
  // Wind particles only while Kitebeach is open (they are about kiting conditions).
  document.body.classList.toggle('kite-closed', cards.find(c => c.id === 'kitebeach-akyaka')?.status?.state === 'closed');
  renderGrid();
  if (map) drawMap();
}

// ---- Category filter + sort (filter applies to list and map, sort to the list) ----
// Entertainment: pubs, bars, taverns, night clubs · Food: restaurants, taverns, cafes · Activity: gym, beach.
const CATEGORIES = {
  fun: ['Pub', 'Bar', 'Meyhane', 'Kulüp'],
  food: ['Restoran', 'Meyhane', 'Kafe'],
  activity: ['Spor', 'Plaj'],
};
const pref = (k, d) => { try { return localStorage.getItem(k) || d; } catch { return d; } };
let category = pref('venueFilter', 'all'), sortBy = pref('venueSort', 'busy');
// A venue's own `categories` in venues.json override the type-based grouping.
// Venues unticked in the list (top-right checkbox on each card) are left off the map.
let mapHidden = new Set((() => { try { return JSON.parse(localStorage.getItem('mapHidden') || '[]'); } catch { return []; } })());
const onMap = v => !mapHidden.has(v.id);
const inCategory = v => category === 'all' || (v.categories ? v.categories.includes(category) : (CATEGORIES[category] || []).includes(v.type));
// Busiest first, closed venues always at the end.
function sorted(cards) {
  const closed = v => v.status?.state === 'closed' ? 1 : 0, n = v => v.latest?.people ?? -1;
  const by = { busy: (a, b) => n(b) - n(a), quiet: (a, b) => n(a) - n(b), name: (a, b) => a.name.localeCompare(b.name, LANG) }[sortBy];
  return [...cards].sort((a, b) => closed(a) - closed(b) || by(a, b));
}
// Cards are rebuilt every minute; a card with a playing background video keeps its video element
// (moving or replacing an iframe would restart it), and only the rest of the card is swapped.
// The card video runs as a full-size 1280×720 player scaled down to cover the card, so YouTube
// does not switch to its small player with on-screen buttons.
const vthumbFit = new ResizeObserver(entries => entries.forEach(({ target: el, contentRect: r }) =>
  el.style.setProperty('--k', Math.max(r.width / 1280, r.height / 720) * 1.12)));
function renderGrid() {
  renderGridNodes();
  document.querySelectorAll('.vthumb:not([data-fit])').forEach(el => { el.dataset.fit = 1; vthumbFit.observe(el); ytReveal(el.querySelector('iframe')); });
}
function renderGridNodes() {
  const grid = $('grid'), tpl = document.createElement('template');
  tpl.innerHTML = sorted(lastCards.filter(inCategory)).map(card).join('');
  const old = new Map([...grid.children].map(el => [el.dataset.id, el]));
  const nodes = [...tpl.content.children].map(el => {
    const prev = old.get(el.dataset.id), keep = prev?.querySelector('.vthumb'), nk = el.querySelector('.vthumb');
    if (!keep || !nk || keep.dataset.key !== nk.dataset.key) return el;
    for (const a of [...prev.attributes]) prev.removeAttribute(a.name);
    for (const a of [...el.attributes]) prev.setAttribute(a.name, a.value);
    const pm = keep.parentNode, nm = nk.parentNode;
    [...prev.children].forEach(c => c !== pm && c.remove());
    [...pm.children].forEach(c => c !== keep && c.remove());
    for (const a of [...pm.attributes]) pm.removeAttribute(a.name);
    for (const a of [...nm.attributes]) pm.setAttribute(a.name, a.value);
    nk.remove(); pm.append(...nm.childNodes);

function drawMap() {
  if (!map) return;
  // While a route is shown, only its destination stays on the map.
  const placed = lastCards.filter(v => v.location && (routeTo ? v.id === routeTo.id : inCategory(v) && onMap(v)));
  markers.clearLayers();
  const pins = spreadPins(placed);
  // Each venue gets an organic heat cloud in its level colour around its (possibly spread) pin;
  // the cloud grows and thickens with the crowd.
  // Quiet venues first, busy ones last and stronger, so a crowded spot's colour wins over the
  // greens and blues of several quiet neighbours.
  heat.setBlobs(placed.filter(v => v.latest && v.status?.state !== 'closed').sort((a, b) => a.latest.people - b.latest.people).map(v => ({
    seed: v.id,
    latlng: pins.get(v.id).latlng,
    color: HEAT.colors[LEVELS.indexOf(levelOf(v.latest.people))],
    alt: HEAT.shift[LEVELS.indexOf(levelOf(v.latest.people))] || null,
    strength: HEAT.opacity * (HEAT.minStrength + (1 - HEAT.minStrength) * Math.pow(Math.min(v.latest.people / HEAT.fullAt, 1), HEAT.curve)),
    meters: HEAT.baseM + Math.min(v.latest.people, 100) * HEAT.perPersonM,
    minPx: HEAT.basePx + Math.min(v.latest.people, 100) * HEAT.perPersonPx,  // keeps the cloud readable when zoomed out
  })));

  for (const v of placed) {
    const n = v.latest ? v.latest.people : null;
    const lv = levelOf(n);

    // A pin pushed off its spot keeps a thin line and a dot at the true location.
    if (pin.moved) {

      L.circleMarker([v.location.lat, v.location.lon], { radius: 3, weight: 1, color: '#ffffff', fillColor: lv ? lv.color : '#898781', fillOpacity: 1, interactive: false }).addTo(markers);
    }

// A 5 × 5 grid of current 10 m wind over the Gökova bay, refreshed every 30 minutes, drawn as drifting
// particles with short fading trails (Windy-style) between the basemap and the heat clouds.

  const lats = [], lons = [];
  for (let i = 0; i < WIND_N; i++) for (let j = 0; j < WIND_N; j++) {
    lats.push((WIND_BOX.n - (WIND_BOX.n - WIND_BOX.s) * i / (WIND_N - 1)).toFixed(4));
    lons.push((WIND_BOX.w + (WIND_BOX.e - WIND_BOX.w) * j / (WIND_N - 1)).toFixed(4));
  }
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=wind_speed_10m,wind_direction_10m,wind_gusts_10m&wind_speed_unit=kn`;
  const rows = await (await fetch(url)).json();
  // Direction is where the wind blows FROM; u points east, v points north.
  const cells = rows.map(r => {
    const sp = r.current.wind_speed_10m, d = r.current.wind_direction_10m * Math.PI / 180;
    return { u: -sp * Math.sin(d), v: -sp * Math.cos(d), sp, gust: r.current.wind_gusts_10m, dir: r.current.wind_direction_10m };
  });
  const mean = k => cells.reduce((a, c) => a + c[k], 0) / cells.length;
  const u = mean('u'), v = mean('v');
  // Today's hourly wind over the bay (Turkish time) for the small chart in the readout.
  let hours = windField?.hours || [];
  try {
    const h = await (await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.04&longitude=28.28&hourly=wind_speed_10m,wind_gusts_10m&wind_speed_unit=kn&timezone=Europe%2FIstanbul&forecast_days=1')).json();
    hours = h.hourly.time.map((t, i) => ({ h: +t.slice(11, 13), sp: h.hourly.wind_speed_10m[i], gust: h.hourly.wind_gusts_10m[i] }));
  } catch {}
  hours = hours.map(h => ({ ...h, obs: false }));
  let speed = Math.hypot(u, v), gust = Math.max(...cells.map(c => c.gust)), from = (Math.atan2(-u, -v) * 180 / Math.PI + 360) % 360, station = false;
  // Real readings from the Akyaka station win over the model: the readout shows them, today's chart uses
  // them up to now (the forecast fills in the rest of the day) and the bay's particle field is scaled and
  // turned to match the station.
  const st = await loadStation();
  if (st) {
    const c = st.current, d = c.dir * Math.PI / 180, su = -c.avg * Math.sin(d), sv = -c.avg * Math.cos(d);
    if (speed < 0.5) cells.forEach(cell => Object.assign(cell, { u: su, v: sv }));
    else {
      const k = c.avg / speed, rot = Math.atan2(su, sv) - Math.atan2(u, v), cs = Math.cos(rot), sn = Math.sin(rot);
      cells.forEach(cell => { const cu = cell.u * k, cv = cell.v * k; cell.u = cu * cs + cv * sn; cell.v = -cu * sn + cv * cs; });
    }
    const today = localIso(new Date()).slice(0, 10);
    const obs = st.history.filter(r => r[0].startsWith(today)).map(([at, avg, , max]) => ({ h: +at.slice(11, 13) + +at.slice(14, 16) / 60, sp: avg, gust: max, obs: true }));
    if (st.current.at.startsWith(today)) obs.push({ h: +c.at.slice(11, 13) + +c.at.slice(14, 16) / 60, sp: c.avg, gust: c.max, obs: true });
    if (obs.length) { const last = obs[obs.length - 1].h; hours = [...obs, ...hours.filter(h => h.h > last)]; }
    speed = c.avg; gust = c.max; from = c.dir; station = true;
  }

// Wind is always on; its readout (mean wind over the bay, knots and from-direction) sits under the

let windLayer = null, windCtl = null;
const COMPASS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
// Today's wind (00–24) under the readout: wind speed as an area + line coloured by strength band, gusts
// as a faint dashed line, a dot at the current hour and a few hour ticks.
function windChart(hours) {
  if (!hours?.length) return '';
  const W = 180, H = 38, top = 5, bot = 11;
  // Scaled to the day's own gusts, so even a light day shows its ups and downs.
  const max = Math.max(6, ...hours.map(h => h.gust)) * 1.08;
  const x = h => 2 + Math.min(h, 24) / 24 * (W - 4), y = v => top + (1 - v / max) * (H - top - bot);
  // Station readings (solid, up to now) and the forecast for the rest of the day (dashed).
  const ob = hours.filter(h => h.obs), fc = hours.filter(h => !h.obs);
  const solid = ob.length ? ob : hours, ahead = ob.length && fc.length ? [ob[ob.length - 1], ...fc] : [];
  const sp = solid.map(h => [x(h.h), y(h.sp)]), gu = hours.map(h => [x(h.h), y(h.gust)]);
  const line = roundedLine(sp, ob.length ? 3 : 8);
  const stops = WIND_BANDS.map((b, i) => { const lo = i ? WIND_BANDS[i - 1].max : 0, hi = b.max === Infinity ? max : b.max; return [Math.min(1, (lo + hi) / 2 / max), b.color]; })
    .filter(([o], i, a) => i === 0 || a[i - 1][0] < 1);
  const grad = (id, op) => `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="0" y1="${y(0)}" x2="0" y2="${y(max)}">${stops.map(([o, c]) => `<stop offset="${o}" stop-color="${c}" stop-opacity="${op}"/>`).join('')}</linearGradient>`;
  const now = new Date();
  let nh = now.getHours() + now.getMinutes() / 60, nv;
  if (ob.length) { nh = ob[ob.length - 1].h; nv = ob[ob.length - 1].sp; }
  else { const ni = Math.min(hours.length - 1, Math.floor(nh)); nv = hours[ni].sp + ((hours[Math.min(hours.length - 1, ni + 1)].sp - hours[ni].sp) * (nh - ni)); }
  const ticks = [0, 6, 12, 18].map(h => `<text x="${x(h)}" y="${H - 2}" text-anchor="${h ? 'middle' : 'start'}">${String(h).padStart(2, '0')}</text>`).join('');
  return `<svg class="wr-chart" viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs>${grad('wcL', 1)}${grad('wcA', 0.35)}</defs>
    <path d="${roundedLine(gu, 8)}" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3" opacity=".35"/>
    <path d="${line}L${sp[sp.length - 1][0]},${y(0)}L${sp[0][0]},${y(0)}Z" fill="url(#wcA)"/>
    <path d="${line}" fill="none" stroke="url(#wcL)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${ahead.length ? `<path d="${roundedLine(ahead.map(h => [x(h.h), y(h.sp)]), 8)}" fill="none" stroke="url(#wcL)" stroke-width="1.5" stroke-dasharray="3 3" opacity=".6"/>` : ''}
    <line x1="${x(nh)}" x2="${x(nh)}" y1="${top - 4}" y2="${y(0)}" stroke="currentColor" stroke-width="1" opacity=".25"/>
    <circle cx="${x(nh)}" cy="${y(nv)}" r="3.5" fill="${WIND_BANDS[windBand(nv)].color}" stroke="#fff" stroke-width="1.5"/>${ticks}</svg>`;
}

// Everything on top (pins, labels, clouds, wind, kitesurfers, routes) keeps its normal look:

  for(const v of [...placed].sort((a,b)=>(b.latest?.people??-1)-(a.latest?.people??-1))) {
    const p=map.latLngToContainerPoint(pins.get(v.id).latlng);
    if(labelled.some(q=>Math.hypot(q.x-p.x,q.y-p.y)<CLUSTER_PX))continue;
    const {w,h}=labelSize(v), found=findVenueLabel(p,w,h,venuePinRadius(v),obstacles,labelPlacementMemory.get(v.id));
    if(found) {out.set(v.id,found);obstacles.push(found.box);labelled.push(p);labelPlacementMemory.set(v.id,found);}
  }
  return out;
}

// Pins closer than MIN_GAP pixels are pushed apart on screen; zooming in shrinks the push until
// every pin sits on its true location. Labels go to the side the pin was pushed towards.
const PIN = 42, MIN_GAP = PIN + 10;
// Pin size by crowd level: Quiet, Normal, Busy, Crowded, Very crowded.
const PIN_SCALE = [0.9, 1, 1.05, 1.15, 1.3];
function spreadPins(placed) {
  const pts = placed.map(v => ({ id: v.id, home: map.latLngToLayerPoint([v.location.lat, v.location.lon]) }));
  pts.forEach(p => { p.x = p.home.x; p.y = p.home.y; });
  for (let iter = 0; iter < 30; iter++) {
    let moved = false;
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const a = pts[i], b = pts[j];
      let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
      if (d >= MIN_GAP) continue;
      if (d < 0.01) { dx = 1; dy = 0; d = 1; }  // same spot: split sideways
      const push = (MIN_GAP - d) / 2;
      a.x -= dx / d * push; a.y -= dy / d * push;
      b.x += dx / d * push; b.y += dy / d * push;
      moved = true;
    }
    if (!moved) break;
  }
  const out = new Map();
  for (const p of pts) {
    const dx = p.x - p.home.x, dy = p.y - p.home.y;
    const moved = Math.hypot(dx, dy) > 2;
    // Labels are wide (32px count): a pin with a neighbour close enough for their labels to touch
    // puts its label on the side away from it.
    const near = pts.find(o => o !== p && Math.abs(o.x - p.x) < 110 && Math.abs(o.y - p.y) < 50);
    const dir = near ? (near.x > p.x ? 'left' : 'right')
      : !moved ? 'top' : Math.abs(dx) >= Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : 'top';
    out.set(p.id, { latlng: map.layerPointToLatLng(L.point(p.x, p.y)), moved, dir });
  }
  return out;
}

function ago(ts) {
  if (!ts) return t('agoNone');

}

// Today's people-over-the-day chart drawn faintly (20%) behind every card's text and open map label.
// Same look as the venue page chart: an area and line coloured by crowd level. Also behind its map label.
function cardChart(v, tag = 'c') {
  const now = new Date(), day = new Date(now); if (day.getHours() < 6) day.setDate(day.getDate() - 1);
  const frames = v.simulated ? simFrames(v, localIso(day).slice(0, 10), now) : v.today || [];
  if (frames.length < 2) return '';
  // The line runs edge to edge: from the day's first frame to the latest one.
  const W = 300, H = 100, max = Math.max(10, ...frames.map(f => f.people)) * 1.08;
  const hOf = f => { const d = new Date(f.timestamp); return d.getHours() + d.getMinutes() / 60 + (d.getHours() < 6 ? 24 : 0); };
  const t0 = hOf(frames[0]), t1 = Math.max(t0 + 0.5, hOf(frames[frames.length - 1]));
  const pts = frames.map(f => [((hOf(f) - t0) / (t1 - t0)) * W, H - f.people / max * H]);
  const line = roundedLine(pts);
  const stops = LEVELS.map((l, i) => { const lo = i ? LEVELS[i - 1].max + 1 : 0, hi = l.max === Infinity ? max : l.max; return [Math.min(1, (lo + hi) / 2 / max), l.color]; })
    .filter(([o], i, a) => i === 0 || a[i - 1][0] < 1);
  const grad = (id, op) => `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="0" y1="${H}" x2="0" y2="0">${stops.map(([o, c]) => `<stop offset="${o}" stop-color="${c}" stop-opacity="${op}"/>`).join('')}</linearGradient>`;
  return `<svg class="cardchart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><defs>${grad(`cc-l-${tag}-${v.id}`, 1)}${grad(`cc-a-${tag}-${v.id}`, 0.5)}</defs>
    <path d="${line}L${pts[pts.length - 1][0]},${H}L${pts[0][0]},${H}Z" fill="url(#cc-a-${tag}-${v.id})"/>
    <path d="${line}" fill="none" stroke="url(#cc-l-${tag}-${v.id})" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}

      ${v.peak ? `<div class="peaktag">${PEAK_ICON}${t('atPeak')}</div>` : ''}
      ${v.rising ? `<div class="rising">${RISE_ICON}${t('rising')}</div>` : ''}

      <div class="updated">${statusLine(v, live)}<span title="${v.updatedAt ? v.updatedAt.replace('T', ' ') : ''}">${live ? t('lastUpdate', ago(v.updatedAt)) : v.coming_soon ? t('soonCamera') : t('noUpdates')}</span></div>

}

// ---- Recommendations ----
// Scores every open venue from what the data says right now: a lively-but-not-packed crowd scores best,
// a venue getting busier, a booked night or an expected peak adds to it, the venue type has to suit the
// hour (beach and cafes by day, bars and clubs at night, restaurants at meal times) and a venue about to
// close drops. Returns the top three with the reasons behind each.
const FUN = ['Pub', 'Bar', 'Meyhane', 'Kulüp'], FOOD = ['Restoran', 'Meyhane', 'Kafe'], ACTIVE = ['Spor', 'Plaj'];
function recommend(cards, now = new Date()) {
  const h = now.getHours() + now.getMinutes() / 60;
  const night = h >= 19 || h < 4, day = h >= 8 && h < 18, meal = (h >= 12 && h < 15) || (h >= 19 && h < 22.5), evening = h >= 17 || h < 4;
  return cards.filter(v => v.latest && !v.coming_soon && v.status?.state !== 'closed').map(v => {
    const n = v.latest.people, lvl = LEVELS.indexOf(levelOf(n)), why = [];
    let score = [0.4, 1.1, 1.5, 1.3, 0.9][lvl] ?? 0.4;
    why.push(lvl === 0 ? t('recQuiet', n) : lvl >= 4 ? t('recPacked', n) : t('recLively', n));
    if (v.peak) { score += 0.5; why.push(t('atPeak')); }
    if (v.rising) { score += 0.6; why.push(t('rising')); }
    if (v.expected) { score += 0.3; why.push(t('expectedAround', v.expected)); }
    if (v.event && v.event.state !== 'past') {
      // Music nights count in the evening; a daytime class (yoga) counts by day.
      const daytime = v.event.kind === 'yoga';
      score += (daytime ? !night : evening) ? 0.8 : 0.25;
      why.push(`${v.event.name} · ${v.event.from}–${v.event.to}`);
    }
    if (night && FUN.includes(v.type)) score += 0.6;
    if (day && (ACTIVE.includes(v.type) || v.type === 'Kafe')) score += 0.6;
    if (meal && FOOD.includes(v.type)) score += 0.4;
    if (v.status?.state === 'closing') { score -= 0.7; why.push(`${t('closingSoon')} · ${v.status.closes}`); }
    else if (v.status?.closes) why.push(t('recOpenUntil', v.status.closes));
    if (!v.simulated && v.data) score += 0.05;  // a live camera count is a little more trustworthy
    return { v, score, why: why.slice(0, 3) };
  }).sort((a, b) => b.score - a.score).slice(0, 3);
}
const partOfDay = h => h < 5 ? t('recLateNight') : h < 12 ? t('recMorning') : h < 17 ? t('recAfternoon') : h < 21 ? t('recEvening') : t('recNight');
function answerWhere() {
  const now = new Date(), picks = recommend(lastCards, now);
  if (!picks.length) {
    // Everything is shut: point at what opens next instead.
    const next = lastCards.filter(v => v.status?.state === 'closed' && v.status.opens)
      .sort((a, b) => toMin(a.status.opens) - toMin(b.status.opens)).slice(0, 3);
    return `<p>${t('recAllClosed')}</p>${next.map(v => `<div class="rec"><div class="rec-top">${logoHtml(v)}<div><b>${v.name}</b><span>${typeName(v.type)} · ${t('opensAt', v.status.opens)}</span></div></div></div>`).join('')}`;
  }
  const clock = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  return `<p>${t('recIntro', clock, partOfDay(now.getHours()))}</p>` + picks.map(({ v, why }, i) => {
    const lv = levelOf(v.latest.people);
    return `<div class="rec" style="--lv:${lv.color}">
      <div class="rec-top"><span class="rec-rank">${i + 1}</span>${logoHtml(v)}<div><b>${v.name}</b><span>${typeName(v.type)} · <i class="lvdot"></i>${v.latest.people} ${t('people')}</span></div></div>
      <ul>${why.map(w => `<li>${w}</li>`).join('')}</ul>
      <div class="rec-actions"><a href="venue.html?mekan=${v.id}">${t('recOpen')}</a><button data-focus="${v.id}">${t('recRoute')}</button></div>
    </div>`;
  }).join('') + `<p class="rec-note">${t('recNote')}</p>`;
}
// ---- More questions: made-up venue profiles + answers from several angles ----
// We have no real data for breakfast, music, cocktails or prices beyond the demo menu, so each venue gets a
// fixed, plausible profile from its type and a per-venue random (same answer every time). Prices come from
// the demo menu (menu.js). Every answer shows a few angles: most crowded, quietest, cheapest, priciest, best rated.
const GENRES = {
  Kulüp: ['house', 'techno', 'pop'], Bar: ['indie', 'jazz', 'rock'], Pub: ['rock', '80s · 90s', 'blues'],
  Meyhane: ['fasıl'], Otel: ['lounge'], Plaj: ['chill house'], Kafe: ['acoustic'], Restoran: ['jazz'],
};
const rnd = (v, k) => simRandom(`${v.id}:${k}`);
const rate = (lo, hi, r) => Math.round((lo + (hi - lo) * r) * 10) / 10;
function profile(v) {
  const r = k => rnd(v, k), ty = v.type;
  const breakfast = { Kafe: [4.1, 4.9], Restoran: [3.3, 4.4], Otel: [3.8, 4.9], Plaj: [2.8, 3.6] }[ty];
  const music = { Kulüp: [4.0, 4.9], Bar: [3.6, 4.7], Pub: [3.5, 4.6], Meyhane: [3.6, 4.6], Otel: [3.2, 4.2], Plaj: [3.4, 4.3], Kafe: [2.6, 3.5], Restoran: [2.4, 3.3] }[ty];
  const cocktails = { Bar: [4.0, 4.9], Kulüp: [3.5, 4.5], Otel: [3.9, 4.8], Plaj: [3.1, 4.0], Pub: [3.0, 3.9], Kafe: [2.6, 3.5] }[ty];
  const menu = demoMenu(v), sec = k => { const key = MENU_BY_TYPE[ty] || MENU_BY_TYPE.Bar; const i = key.indexOf(k); return i >= 0 ? menu[i].items : null; };
  const avg = a => a?.length ? Math.round(a.reduce((x, i) => x + i.price, 0) / a.length / 10) * 10 : null;
  const food = [sec('mains'), sec('meze'), sec('bites'), sec('breakfast')].filter(Boolean).flat();
  const beer = sec('beer'), cock = sec('cocktails'), bf = sec('breakfast');
  const g = GENRES[ty] || ['pop'];
  const softs = sec('softs'), demoCoffee = softs ? Math.min(...softs.filter((_, i) => i >= 2).map(i => i.price)) : null;
  // Venues with a real menu (VENUE_MENUS, e.g. Lemongrass) use its actual prices; what it does not
  // sell (no food, beer, rakı or cocktails on the board) stays empty, so it is not ranked on those.
  const real = VENUE_MENUS[v.id];
  if (real) {
    const items = real.sections.flatMap(sc => sc.items.map(([, , price]) => ({ sec: sc.en, price })));
    const coffee = items.filter(i => i.sec === 'Coffee').map(i => i.price);
    return {
      breakfast: null, menemen: null, serpme: null,
      music: music ? rate(...music, r('mu')) : null, genre: g[Math.floor(r('genre') * g.length)],
      cocktails: null, cocktail: null, food: null, cheapestFood: null, beer: null, raki: null,
      coffee: coffee.length ? Math.min(...coffee) : null, real: true,
    };
  }
  return {
    coffee: demoCoffee,
    breakfast: breakfast && (ty !== 'Restoran' || r('bfOn') > 0.4) ? rate(...breakfast, r('bf')) : null,
    menemen: bf ? bf[1].price : null, serpme: bf ? bf[0].price : null,
    music: music ? rate(...music, r('mu')) : null, genre: g[Math.floor(r('genre') * g.length)],
