<!doctype html>
<html lang="tr">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --series: #2a78d6; --live: #006300;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --series: #3987e5; --live: #0ca30c;
  }
}
:root[data-theme="dark"] {
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --series: #3987e5; --live: #0ca30c;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1120px; margin: 0 auto; padding: 28px 16px 48px; }
h1 { font-size: 24px; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--ink-2); margin: 2px 0 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.venue { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
.venue:hover { border-color: var(--axis); transform: translateY(-1px); }
.venue:focus-visible { outline: 2px solid var(--series); outline-offset: 2px; }
.media { aspect-ratio: 4 / 3; background: var(--grid); position: relative; }
.media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.logo { width: 44px; height: 44px; border-radius: 50%; flex: none; position: relative; overflow: hidden; background: var(--grid); box-shadow: 0 0 0 3px var(--lv, var(--border)); display: grid; place-items: center; font-weight: 700; font-size: 14px; color: var(--ink-2); }
.logo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.14); } /* logos are screenshots with a dark margin: zoom past it */
.media .logo { position: absolute; right: 12px; bottom: -22px; box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--lv, var(--border)); }
.media { overflow: visible; }
.body { padding-top: 14px; }
.top { padding-right: 56px; }
.maplogo { background: none; border: 0; }
.maplogo .logo { width: 100%; height: 100%; box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--lv, #898781), 0 4px 12px rgba(0,0,0,.35); cursor: pointer; }
.media .none { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; border-bottom: 1px dashed var(--axis); }
.body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.name { font-weight: 600; font-size: 16px; }
.type { color: var(--muted); font-size: 12px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--axis); }
.status.live .dot { background: var(--live); }
.status.soon .dot { background: #eda100; }
.media .none.soon, .media .none { text-align: center; }
.stat { display: flex; align-items: baseline; gap: 6px; margin-top: auto; }
.stat b { font-size: 26px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--ink-2); font-size: 13px; }
.arrow { margin-left: auto; color: var(--muted); }
.tabs { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); margin-bottom: 16px; }
.tab { font: inherit; font-size: 13px; color: var(--ink-2); background: transparent; border: 0; border-radius: 7px; padding: 6px 14px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--grid); color: var(--ink); font-weight: 600; }
.mapwrap { position: relative; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface); }
#map { height: min(70vh, 620px); min-height: 360px; }
.legend { position: absolute; right: 12px; bottom: 12px; z-index: 500; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--ink-2); }
.legend .rows { display: grid; gap: 4px; margin-top: 6px; }
.venue { border-left: 4px solid var(--lv, var(--border)); }
.maphint { color: var(--muted); font-size: 12px; margin-top: 8px; }
.leaflet-tooltip.vlabel { background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); font: 12px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 4px 8px; }
.leaflet-tooltip.vlabel b { font-size: 14px; font-variant-numeric: tabular-nums; }
.leaflet-tooltip.vlabel::before { display: none; }
.leaflet-container { font: inherit; }
.heatcanvas { position: absolute; pointer-events: none; filter: blur(8px) saturate(1.15); transition: opacity .2s; }
.townlabel span { display: inline-block; color: rgba(255,255,255,.78); font-size: 15px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; text-shadow: 0 1px 3px rgba(0,0,0,.8); transform: translate(-50%, -50%); pointer-events: none; }
.updated { color: var(--muted); font-size: 12px; border-top: 1px solid var(--grid); padding-top: 8px; }
</style>
<link rel="stylesheet" href="theme.css?v=20261104c">
</head>
<body>
<main>
  <p class="sub" id="subtitle" hidden></p>
  <div class="topbar">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-liste" aria-controls="view-liste"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="7" height="7" rx="2" fill="currentColor"/><rect x="13.5" y="4" width="7" height="7" rx="2" fill="currentColor"/><rect x="3.5" y="13" width="7" height="7" rx="2" fill="currentColor"/><rect x="13.5" y="13" width="7" height="7" rx="2" fill="currentColor"/></svg><span data-i18n="tabList">List view</span></button>
      <button class="tab" role="tab" id="tab-harita" aria-controls="view-harita"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.5 3.5 6.6v13l5.5-2.1 6 2.1 5.5-2.1v-13L15 6.6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 4.5v13M15 6.6v13" stroke="currentColor" stroke-width="1.8"/></svg><span data-i18n="tabMap">Heatmap</span></button>
    </div>
    <div class="subbar">
    <div class="filters" role="group" data-i18n-aria="filterAria">
      <button data-cat="all" data-i18n-aria="filterAll" data-i18n-title="filterAll"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="7" r="2.6" fill="currentColor"/><circle cx="17" cy="7" r="2.6" fill="currentColor"/><circle cx="7" cy="17" r="2.6" fill="currentColor"/><circle cx="17" cy="17" r="2.6" fill="currentColor"/></svg></button>
      <button data-cat="fun" data-i18n-aria="filterFun" data-i18n-title="filterFun"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14l-7 8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 12v7M8 20h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M7.2 6.5h9.6" stroke="currentColor" stroke-width="1.8"/></svg></button>
      <button data-cat="food" data-i18n-aria="filterFood" data-i18n-title="filterFood"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 11v10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M17 21V3c-2.2 1.2-3.5 4-3.5 7.5V13H17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg></button>
      <button data-cat="activity" data-i18n-aria="filterActivity" data-i18n-title="filterActivity"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="14.5" cy="4.5" r="2" fill="currentColor"/><path d="M6 21l3-6 3 2.5V21M9 15l1.5-5.5L14 11l3 2.5M10.5 9.5 7 11M14 11l-1.5 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <select id="sort" data-i18n-aria="sortAria">
      <option value="busy" data-i18n="sortBusy">Busiest first</option>
      <option value="quiet" data-i18n="sortQuiet">Quietest first</option>
      <option value="name" data-i18n="sortName">Name A–Z</option>
    </select>
    </div>
  </div>
  <section id="view-liste" role="tabpanel"><div class="grid" id="grid"></div></section>
  <section id="view-harita" role="tabpanel" hidden>
    <div class="mapwrap">
      <div id="map" data-i18n-aria="mapAria"></div>
      <div class="legend"><div data-i18n="legendTitle">People in the latest frame</div><div class="rows" id="legendRows"></div></div>
    </div>
    <p class="maphint" data-i18n="mapHint"></p>
  </section>
</main>
<dialog id="settings" class="sheet">
  <form id="settingsForm" method="dialog">
    <h2 id="setTitle"></h2>
    <p class="hint" data-i18n="settingsHint"></p>
    <label class="row"><span data-i18n="alwaysOpen"></span><input type="checkbox" id="setAlways"></label>
    <div class="times">
      <label><span data-i18n="opens"></span><input type="time" id="setOpen" required></label>
      <label><span data-i18n="closes"></span><input type="time" id="setClose" required></label>
    </div>
    <label class="desc"><span data-i18n="description"></span><textarea id="setDesc" rows="4" maxlength="400" data-i18n-placeholder="descPlaceholder"></textarea></label>
    <div class="actions"><button type="button" id="setCancel" data-i18n="cancel"></button><button type="submit" class="primary" data-i18n="save"></button></div>
  </form>
</dialog>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script src="levels.js?v=20261104c"></script>
<script src="venue-state.js?v=20261104c"></script>

<script>
const $ = id => document.getElementById(id);
const hm = ts => ts.slice(11, 16);

async function load() {
  const { venues } = await (await fetch(`data/venues.json?t=${Date.now()}`)).json();
  const now = new Date();
  const cards = await Promise.all(venues.map(withSettings).map(async v => {
    let latest = null, updatedAt = '', rising = false;
    if (v.simulated) {
      latest = simLatest(v, now);
      updatedAt = latest.timestamp;
      rising = risingSim(v, now);
    } else if (v.data) {
      const { frames, updated_at } = await (await fetch(`${v.data}?t=${Date.now()}`)).json();
      updatedAt = updated_at || '';
      // Same rule as the venue page: a frame counts only once its time has passed.
      const due = frames.filter(f => new Date(f.timestamp) <= now);
      latest = due[due.length - 1] || null;
      rising = risingFromFrames(due);
    }
    const status = venueStatus(v, now);
    return { ...v, latest, updatedAt, status, rising: rising && status.state !== 'closed' };
  }));
  document.title = `${t('venues')} · ${t('occupancy')}`;
  $('subtitle').textContent = t('listSub', venues.length, now.toTimeString().slice(0, 5));
  lastCards = cards;
  renderGrid();
  if (map) drawMap();
}

// ---- Category filter + sort (filter applies to list and map, sort to the list) ----
// Entertainment: pubs, bars, taverns, night clubs · Food: restaurants, taverns, cafes · Activity: gym, beach.
const CATEGORIES = {
  fun: ['Pub', 'Bar', 'Meyhane', 'Kulüp'],
  food: ['Restoran', 'Meyhane', 'Kafe'],
  activity: ['Spor', 'Plaj'],
};
const pref = (k, d) => { try { return localStorage.getItem(k) || d; } catch { return d; } };
let category = pref('venueFilter', 'all'), sortBy = pref('venueSort', 'busy');
// A venue's own `categories` in venues.json override the type-based grouping.
const inCategory = v => category === 'all' || (v.categories ? v.categories.includes(category) : (CATEGORIES[category] || []).includes(v.type));
// Busiest first, closed venues always at the end.
function sorted(cards) {
  const closed = v => v.status?.state === 'closed' ? 1 : 0, n = v => v.latest?.people ?? -1;
  const by = { busy: (a, b) => n(b) - n(a), quiet: (a, b) => n(a) - n(b), name: (a, b) => a.name.localeCompare(b.name, LANG) }[sortBy];
  return [...cards].sort((a, b) => closed(a) - closed(b) || by(a, b));
}
function renderGrid() { $('grid').innerHTML = sorted(lastCards.filter(inCategory)).map(card).join(''); }
function syncFilters() {
  document.querySelectorAll('.filters [data-cat]').forEach(b => b.setAttribute('aria-pressed', b.dataset.cat === category));
  $('sort').value = sortBy;
}
document.querySelector('.filters').onclick = e => {
  const b = e.target.closest('[data-cat]'); if (!b) return;
  category = b.dataset.cat;
  try { localStorage.setItem('venueFilter', category); } catch {}
  syncFilters(); renderGrid(); if (map) drawMap();
};
$('sort').onchange = e => { sortBy = e.target.value; try { localStorage.setItem('venueSort', sortBy); } catch {} renderGrid(); };
syncFilters();

// ---- Tabs ----
let lastCards = [], map = null, markers = null, heat = null;
queueMicrotask(renderLegend);  // after the HEAT settings further down are initialised

function showTab(name) {
  const harita = name === 'harita';
  $('tab-liste').setAttribute('aria-selected', !harita);
  $('tab-harita').setAttribute('aria-selected', harita);
  $('view-liste').hidden = harita;
  $('view-harita').hidden = !harita;
  document.body.classList.toggle('mapmode', harita);
  history.replaceState(null, '', `#${harita ? 'harita' : 'liste'}`);
  if (harita) { initMap(); map.invalidateSize(); drawMap(); }
}
$('tab-liste').onclick = () => showTab('liste');
$('tab-harita').onclick = () => showTab('harita');

// ---- Heatmap (Akyaka + Akçapınar) ----
function initMap() {
  if (map) return;
  // Zoom is limited to 14 (both towns in view) … 16 (a few streets around a venue).
  map = L.map('map', { scrollWheelZoom: true, minZoom: innerWidth < 640 ? 13 : 14, maxZoom: 18 });
  // Akyaka in the north-west, Akçapınar to the south-east.
  map.fitBounds([[37.020, 28.318], [37.062, 28.366]]);
  heat = new HeatBlobs().addTo(map);
  markers = L.layerGroup().addTo(map);
  map.on('zoomend moveend', drawMap);
  addBasemap();
  addZoomPanel();
  addHeatPanel();
  drawMap();
}

function drawMap() {
  if (!map) return;
  const placed = lastCards.filter(v => v.location && inCategory(v));
  markers.clearLayers();
  const pins = spreadPins(placed);
  // Each venue gets an organic heat cloud in its level colour around its (possibly spread) pin;
  // the cloud grows and thickens with the crowd.
  // Quiet venues first, busy ones last and stronger, so a crowded spot's colour wins over the
  // greens and blues of several quiet neighbours.
  heat.setBlobs(placed.filter(v => v.latest && v.status?.state !== 'closed').sort((a, b) => a.latest.people - b.latest.people).map(v => ({
    seed: v.id,
    latlng: pins.get(v.id).latlng,
    color: HEAT.colors[LEVELS.indexOf(levelOf(v.latest.people))],
    alt: HEAT.shift[LEVELS.indexOf(levelOf(v.latest.people))] || null,
    strength: HEAT.opacity * (HEAT.minStrength + (1 - HEAT.minStrength) * Math.pow(Math.min(v.latest.people / HEAT.fullAt, 1), HEAT.curve)),
    meters: HEAT.baseM + Math.min(v.latest.people, 100) * HEAT.perPersonM,
    minPx: HEAT.basePx + Math.min(v.latest.people, 100) * HEAT.perPersonPx,  // keeps the cloud readable when zoomed out
  })));
  const labels = placeLabels(placed, pins);
  for (const v of placed) {
    const n = v.latest ? v.latest.people : null;
    const lv = levelOf(n);
    const pin = pins.get(v.id);
    const closed = v.status?.state === 'closed';
    // A pin pushed off its spot keeps a thin line and a dot at the true location.
    if (pin.moved) {
      L.polyline([[v.location.lat, v.location.lon], pin.latlng], { color: '#ffffff', weight: 1.5, opacity: 0.8, interactive: false }).addTo(markers);
      L.circleMarker([v.location.lat, v.location.lon], { radius: 3, weight: 1, color: '#ffffff', fillColor: lv ? lv.color : '#898781', fillOpacity: 1, interactive: false }).addTo(markers);
    }
    const m = L.marker(pin.latlng, {
      icon: L.divIcon({ className: `maplogo${closed ? ' is-closed' : ''}${n !== null && n < 10 ? ' is-low' : ''}`, html: `<div style="--lv:${lv && !closed ? HEAT.colors[LEVELS.indexOf(lv)] : '#636366'};--s:${lv && !closed ? PIN_SCALE[LEVELS.indexOf(lv)] : 0.9};width:100%;height:100%">${logoHtml(v)}${closed ? `<span class="lockover">${LOCK_ICON}</span>` : ''}</div>`, iconSize: [PIN, PIN], iconAnchor: [PIN / 2, PIN / 2] }),
      title: v.name,
    }).addTo(markers);
    const dir = labels.get(v.id);
    if (dir) {
      const offset = { top: [0, -PIN / 2 - 2], bottom: [0, PIN / 2 + 2], left: [-PIN / 2 - 2, 0], right: [PIN / 2 + 2, 0] }[dir];
      m.bindTooltip(v.coming_soon ? `<span class="vname">${v.name}</span><span class="vsoon">${t('soon')}</span>`
        : closed ? `<span class="vclosed">${t('closed')}</span><span class="vname">${v.name}</span>`
        : `<span class="vcount">${n === null ? '—' : n}${PERSON_ICON}</span><span class="vname">${v.name}</span>${v.rising ? `<span class="vrise">${RISE_ICON}${t('rising')}</span>` : ''}`,
        { permanent: true, direction: dir, offset, className: 'vlabel' });
    } else {
      // Not the busiest of its cluster: no permanent label; name and count only on hover.
      m.bindTooltip(`<span class="vcount">${closed ? t('closed') : n === null ? '—' : n}${closed ? '' : PERSON_ICON}</span><span class="vname">${v.name}</span>`,
        { direction: 'top', offset: [0, -PIN / 2 - 2], className: 'vlabel' });
    }
    m.on('click', () => { location.href = `venue.html?mekan=${v.id}`; });
  }
}

// ---- Zoom limits panel ----
// Min / max zoom the viewer may reach. Saved per browser; defaults keep both towns in view (14)
// down to street level (18).
const ZOOM_DEFAULT = { min: 14, max: 18 }, ZOOM_RANGE = [3, 19];
function loadZoomLimits() {
  try { return { ...ZOOM_DEFAULT, ...JSON.parse(localStorage.getItem('zoomLimits') || '{}') }; } catch { return { ...ZOOM_DEFAULT }; }
}
function addZoomPanel() {
  const lim = loadZoomLimits();
  const apply = () => {
    // Phones get one more step out so both towns fit on a narrow screen.
    map.setMinZoom(innerWidth < 640 ? Math.min(lim.min, 13) : lim.min); map.setMaxZoom(lim.max);
    try { localStorage.setItem('zoomLimits', JSON.stringify(lim)); } catch {}
  };
  apply();
  const Ctl = L.Control.extend({ options: { position: 'topright' }, onAdd() {
    const box = L.DomUtil.create('div', 'zoompanel');
    L.DomEvent.disableClickPropagation(box); L.DomEvent.disableScrollPropagation(box);
    box.innerHTML = `<button class="zp-toggle" aria-expanded="false">${t('zoomPanel')} ▾</button>
      <div class="zp-body" hidden>
        <div class="zp-now">${t('zoomNow')} <b data-now></b></div>
        <label>${t('zoomMin')} <span><input type="range" data-k="min" min="${ZOOM_RANGE[0]}" max="${ZOOM_RANGE[1]}"><output data-o="min"></output></span></label>
        <label>${t('zoomMax')} <span><input type="range" data-k="max" min="${ZOOM_RANGE[0]}" max="${ZOOM_RANGE[1]}"><output data-o="max"></output></span></label>
        <div class="zp-actions"><button data-set="min">${t('zoomSetMin')}</button><button data-set="max">${t('zoomSetMax')}</button></div>
        <button class="zp-reset">${t('zoomReset')}</button>
      </div>`;
    const q = sel => box.querySelector(sel);
    const sync = () => {
      q('[data-now]').textContent = map.getZoom();
      for (const k of ['min', 'max']) { q(`[data-k="${k}"]`).value = lim[k]; q(`[data-o="${k}"]`).textContent = lim[k]; }
    };
    q('.zp-toggle').onclick = () => {
      const b = q('.zp-body'); b.hidden = !b.hidden;
      const tg = q('.zp-toggle'); tg.setAttribute('aria-expanded', !b.hidden); tg.textContent = tg.textContent.replace(/[▾▴]$/, b.hidden ? '▾' : '▴');
    };
    box.querySelectorAll('[data-k]').forEach(inp => inp.oninput = () => {
      lim[inp.dataset.k] = +inp.value;
      // Keep min ≤ max by pushing the other end along.
      if (lim.min > lim.max) inp.dataset.k === 'min' ? (lim.max = lim.min) : (lim.min = lim.max);
      apply(); sync();
    });
    box.querySelectorAll('[data-set]').forEach(btn => btn.onclick = () => {
      lim[btn.dataset.set] = map.getZoom();
      if (lim.min > lim.max) btn.dataset.set === 'min' ? (lim.max = lim.min) : (lim.min = lim.max);
      apply(); sync();
    });
    q('.zp-reset').onclick = () => { Object.assign(lim, ZOOM_DEFAULT); apply(); sync(); };
    map.on('zoomend', sync);
    sync();
    return box;
  } });
  new Ctl().addTo(map);
}

// ---- Basemap ----
// Fixed look: Esri dark gray canvas without any road or street names. The canvas adds street
// names from zoom 15, so tiles are capped at 14 and scaled up beyond. Only the two town names

const BASEMAP_FILTER = 'brightness(72%) contrast(140%) saturate(0%)';

// Subtle gradient over the basemap, under the heat clouds and pins: a soft light from the top-left
// and a gentle darkening towards the bottom edge.
function addShade() {
  const pane = map.createPane('shade');
  pane.style.zIndex = 250;  // above tiles (200), below overlays (400)
  pane.style.pointerEvents = 'none';
  const div = L.DomUtil.create('div', 'mapshade', pane);
  const grid = L.DomUtil.create('div', 'mapgrid', div);
  // The grid is tied to the ground: cells are 32 px at zoom 14 and double with each zoom step, and the
  // lines stay anchored to a fixed point on the map while panning.
  const ORIGIN = L.latLng(37.04, 28.34);
  const place = () => {
    const size = map.getSize();
    L.DomUtil.setPosition(div, map.containerPointToLayerPoint([0, 0]));
    div.style.width = `${size.x}px`; div.style.height = `${size.y}px`;
    const cell = 32 * Math.pow(2, map.getZoom() - 14), major = cell * 5;
    const o = map.latLngToContainerPoint(ORIGIN);
    const mod = (a, m) => ((a % m) + m) % m;
    grid.style.backgroundSize = `${major}px ${major}px, ${major}px ${major}px, ${cell}px ${cell}px, ${cell}px ${cell}px`;
    grid.style.backgroundPosition = [major, major, cell, cell].map(c => `${mod(o.x, c)}px ${mod(o.y, c)}px`).join(', ');
  };
  map.on('move zoom zoomanim resize viewreset', place);

}

// Vector basemap (OpenFreeMap "dark", OpenMapTiles data) drawn by MapLibre at screen resolution, so it
// stays sharp at every zoom. All symbol layers are dropped: no road, street or place names.
// Falls back to the Esri raster canvas when WebGL or the style is unavailable.
const VECTOR_STYLE = 'https://tiles.openfreemap.org/styles/dark';
// Repaint the vector layers in the greys of the earlier raster look (dark land, near-black water,
// light-grey roads), so the contrast stays the same while every line is drawn sharp.
const MAP_COLORS = {
  land: '#1f1f20', water: '#0a0a0b', landuse: '#232324', green: '#212122', building: '#2a2a2b',
  motorway: '#5a5a5d', major: '#4a4a4d', minor: '#38383b', path: '#2c2c2f', rail: '#303033',
};
function recolor(l) {
  const id = l.id, paint = { ...(l.paint || {}) };
  const set = (prop, c) => { paint[prop] = c; return { ...l, paint }; };
  if (l.type === 'background') return set('background-color', MAP_COLORS.land);
  if (/boundary|casing|aeroway|pier/.test(id)) return null;
  if (l.type === 'fill') {
    if (/water/.test(id)) return set('fill-color', MAP_COLORS.water);
    if (/building/.test(id)) return set('fill-color', MAP_COLORS.building);
    if (/wood|park|glacier|ice/.test(id)) return set('fill-color', MAP_COLORS.green);
    return set('fill-color', MAP_COLORS.landuse);
  }
  if (l.type === 'line') {
    if (/water/.test(id)) return set('line-color', MAP_COLORS.water);
    if (/dashline/.test(id)) return null;
    if (/rail/.test(id)) return set('line-color', MAP_COLORS.rail);
    if (/motorway/.test(id)) return set('line-color', MAP_COLORS.motorway);
    if (/major/.test(id)) return set('line-color', MAP_COLORS.major);
    if (/path/.test(id)) return set('line-color', MAP_COLORS.path);
    return set('line-color', MAP_COLORS.minor);
  }
  return l;
}
async function addBasemap() {
  map.getPane('tilePane').style.filter = BASEMAP_FILTER;
  try {
    if (!L.maplibreGL || !window.maplibregl || !document.createElement('canvas').getContext('webgl2')) throw new Error('no WebGL basemap');
    const style = await (await fetch(VECTOR_STYLE)).json();
    style.layers = style.layers.filter(l => l.type !== 'symbol').map(recolor).filter(Boolean);
    map.getPane('tilePane').style.filter = 'none';  // colours are baked into the style instead
    L.maplibreGL({ style, attribution: '&copy; <a href="https://openfreemap.org">OpenFreeMap</a> &copy; <a href="https://www.openmaptiles.org/">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
  } catch {
    L.tileLayer(BASEMAP, { attribution: 'Tiles &copy; Esri', maxZoom: 19, maxNativeZoom: 14 }).addTo(map);
  }
  addShade();
  for (const town of TOWNS)
    L.marker([town.lat, town.lon], { icon: L.divIcon({ className: 'townlabel', html: `<span style="margin-top:${town.dy}px">${town.name}</span>`, iconSize: [0, 0] }), interactive: false, keyboard: false, zIndexOffset: -1000 }).addTo(map);
}

// ---- Organic heat clouds ----

// A canvas layer that draws each venue as a cluster of soft radial gradients ("lobes") placed by a
// per-venue seeded random, then blurred, so the glow reads as a loose crowd rather than a circle.
// The lobes drift slowly; with reduced motion the cloud stays still.
function seeded(str) {
  let h = 2166136261;
  for (const c of str) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296;
}

  return `rgba(${n >> 16}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}
// Some levels drift towards a second colour and back: Normal (green) ↔ blue, Busy (orange) ↔ magenta.
// ---- Heat cloud settings (panel on the map, saved per browser) ----
// size: baseM + people × perPersonM metres (never below basePx + people × perPersonPx on screen);
// priority: strength rises from minStrength to full at fullAt people along a power `curve`;
// colours: one per crowd level, with an optional second colour each level drifts to and back.
const HEAT_DEFAULT = {
  baseM: 10, perPersonM: 1, basePx: 90, perPersonPx: 1,
  minStrength: 0.48, fullAt: 30, curve: 1.3, opacity: 1, blur: 8,
  colors: ['#0e6bdd', '#16ca64', '#ffc800', '#dd5e27', '#c11a4c'],
  shift: [null, '#13cbd8', '#e0962e', null, null],
};
let HEAT = loadHeat();
function loadHeat() {
  try {
    const s = JSON.parse(localStorage.getItem('heatSettings') || '{}');
    return { ...HEAT_DEFAULT, ...s, colors: s.colors || [...HEAT_DEFAULT.colors], shift: s.shift || [...HEAT_DEFAULT.shift] };
  } catch { return structuredClone(HEAT_DEFAULT); }
}
function saveHeat() { try { localStorage.setItem('heatSettings', JSON.stringify(HEAT)); } catch {} }

function mixHex(a, b, f) {
  const x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16);
  const ch = s => Math.round(((x >> s) & 255) + (((y >> s) & 255) - ((x >> s) & 255)) * f);
  return '#' + ((ch(16) << 16) | (ch(8) << 8) | ch(0)).toString(16).padStart(6, '0');
}
const HeatBlobs = L.Layer.extend({
  onAdd(m) {
    this._blobs = this._blobs || [];
    this._canvas = L.DomUtil.create('canvas', 'heatcanvas');
    m.getPanes().overlayPane.appendChild(this._canvas);
    m.on('moveend resize', this._draw, this);
    m.on('zoomstart', this._hide, this);
    m.on('zoomend', this._show, this);
    this._still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const tick = () => { this._draw(); if (!this._still) this._raf = setTimeout(() => requestAnimationFrame(tick), 40); };
    tick();
    return this;
  },
  onRemove(m) {
    clearTimeout(this._raf);
    L.DomUtil.remove(this._canvas);
    m.off('moveend resize', this._draw, this).off('zoomstart', this._hide, this).off('zoomend', this._show, this);
  },
  setBlobs(blobs) {
    this._blobs = blobs.map(b => {
      const rnd = seeded(b.seed);
      const lobes = Array.from({ length: 11 }, (_, i) => ({
        ang: rnd() * Math.PI * 2, dist: i === 0 ? 0 : 0.15 + rnd() * 0.5, size: i === 0 ? 0.75 : 0.32 + rnd() * 0.42,
        speed: 0.6 + rnd() * 0.9, phase: rnd() * Math.PI * 2, wave: 1.2 + rnd() * 1.6,
      }));
      return { ...b, lobes };
    });
    if (this._map) this._draw();
  },
  _hide() { this._canvas.style.opacity = 0; },
  _show() { this._draw(); this._canvas.style.opacity = 1; },
  _draw() {
    const m = this._map; if (!m) return;
    const size = m.getSize(), dpr = window.devicePixelRatio || 1, c = this._canvas;
    L.DomUtil.setPosition(c, m.containerPointToLayerPoint([0, 0]));
    if (c.width !== size.x * dpr || c.height !== size.y * dpr) {
      c.width = size.x * dpr; c.height = size.y * dpr; c.style.width = `${size.x}px`; c.style.height = `${size.y}px`;
    }
    const ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size.x, size.y);
    ctx.globalCompositeOperation = 'source-over';  // normal blending: crowded clusters keep their colours instead of burning to white
    const time = this._still ? 0 : performance.now() / 1000;
    for (const b of this._blobs) {
      const p = m.latLngToContainerPoint(b.latlng);
      const mpp = 40075016.686 * Math.cos(b.latlng.lat * Math.PI / 180) / Math.pow(2, m.getZoom() + 8);
      const R = Math.max(b.meters / mpp, b.minPx);
      b.lobes.forEach(l => {
        // Two waves per lobe: one sways it around the pin, one swells and shrinks it, so the cloud
        // ripples outward like a moving crowd.
        const sway = Math.sin(time * l.speed + l.phase);
        const swell = Math.sin(time * l.speed * l.wave + l.phase * 1.7);
        const ang = l.ang + sway * 0.6;
        const dist = l.dist * (1 + swell * 0.28);
        const x = p.x + Math.cos(ang) * dist * R;
        const y = p.y + Math.sin(ang) * dist * R;
        const r = R * l.size * (1 + swell * 0.22);
        // Each lobe crosses to the second colour and back on its own phase, so both tints live in the cloud.
        const col = b.alt ? mixHex(b.color, b.alt, (Math.sin(time * 0.45 + l.phase * 2.3) + 1) / 2) : b.color;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, rgba(col, 0.32 * b.strength));
        g.addColorStop(0.5, rgba(col, 0.15 * b.strength));
        g.addColorStop(1, rgba(col, 0));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      });
    }
  },
});

// Greedy label layout: busiest venues first, each label tries top / right / left / bottom of its pin
// and takes the first spot that overlaps no pin and no label already placed. Venues that find no spot
// get no permanent label (see the badge fallback above).
const CLUSTER_PX = 120;  // venues closer than this on screen count as one cluster
function placeLabels(placed, pins) {
  const size = map.getSize();
  const boxes = placed.map(v => {
    const p = map.latLngToContainerPoint(pins.get(v.id).latlng);
    return { x: p.x - PIN / 2 - 3, y: p.y - PIN / 2 - 3, w: PIN + 6, h: PIN + 6 };
  });
  const hit = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  const order = [...placed].sort((a, b) => (b.latest?.people ?? -1) - (a.latest?.people ?? -1));
  const out = new Map(), labelled = [], labelBoxes = [];
  for (const v of order) {
    const p = map.latLngToContainerPoint(pins.get(v.id).latlng);
    const w = Math.max(v.rising ? 110 : 56, v.name.length * 6.6 + 22), h = v.rising ? 62 : 46, g = PIN / 2 + 4;
    const spots = {
      top: { x: p.x - w / 2, y: p.y - g - h, w, h }, right: { x: p.x + g, y: p.y - h / 2, w, h },
      left: { x: p.x - g - w, y: p.y - h / 2, w, h }, bottom: { x: p.x - w / 2, y: p.y + g, w, h },
    };
    // In a cluster only the busiest venue keeps its label: skip any venue near one already labelled.
    if (labelled.some(q => Math.hypot(q.x - p.x, q.y - p.y) < CLUSTER_PX)) continue;
    const inside = box => box.x > 4 && box.y > 60 && box.x + box.w < size.x - 4 && box.y + box.h < size.y - 4;
    let found = Object.entries(spots).find(([, box]) => inside(box) && !boxes.some(b => hit(b, box)));
    // A cluster's busiest venue always gets a label: if every spot touches a pin, accept one that
    // only covers pins, as long as it stays clear of other labels.
    if (!found) found = Object.entries(spots).find(([, box]) => inside(box) && !labelBoxes.some(b => hit(b, box)));
    if (found) { const [dir, box] = found; out.set(v.id, dir); boxes.push(box); labelBoxes.push(box); labelled.push(p); }
  }
  return out;
}

// Pins closer than MIN_GAP pixels are pushed apart on screen; zooming in shrinks the push until
// every pin sits on its true location. Labels go to the side the pin was pushed towards.
const PIN = 42, MIN_GAP = PIN + 10;
// Pin size by crowd level: Quiet, Normal, Busy, Crowded, Very crowded.
const PIN_SCALE = [0.9, 1, 1.05, 1.15, 1.3];
function spreadPins(placed) {
  const pts = placed.map(v => ({ id: v.id, home: map.latLngToLayerPoint([v.location.lat, v.location.lon]) }));
  pts.forEach(p => { p.x = p.home.x; p.y = p.home.y; });
  for (let iter = 0; iter < 30; iter++) {
    let moved = false;
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const a = pts[i], b = pts[j];
      let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
      if (d >= MIN_GAP) continue;
      if (d < 0.01) { dx = 1; dy = 0; d = 1; }  // same spot: split sideways
      const push = (MIN_GAP - d) / 2;
      a.x -= dx / d * push; a.y -= dy / d * push;
      b.x += dx / d * push; b.y += dy / d * push;
      moved = true;
    }
    if (!moved) break;
  }
  const out = new Map();
  for (const p of pts) {
    const dx = p.x - p.home.x, dy = p.y - p.home.y;
    const moved = Math.hypot(dx, dy) > 2;
    // Labels are wide (32px count): a pin with a neighbour close enough for their labels to touch
    // puts its label on the side away from it.
    const near = pts.find(o => o !== p && Math.abs(o.x - p.x) < 110 && Math.abs(o.y - p.y) < 50);
    const dir = near ? (near.x > p.x ? 'left' : 'right')
      : !moved ? 'top' : Math.abs(dx) >= Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : 'top';
    out.set(p.id, { latlng: map.layerPointToLatLng(L.point(p.x, p.y)), moved, dir });
  }
  return out;
}

// "az önce", "15 dk önce", "2 sa önce", "1 gün önce"
function ago(ts) {
  if (!ts) return t('agoNone');
  const min = Math.floor((Date.now() - new Date(ts)) / 60000);
  if (min < 1) return t('agoNow');
  if (min < 60) return t('agoMin', min);
  if (min < 1440) return t('agoHour', Math.floor(min / 60));
  return t('agoDay', Math.floor(min / 1440));
}

// Round venue logo; falls back to initials until logos/<id>.png exists.
function logoHtml(v) {
  const initials = v.name.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
  // logo_scale (venues.json) overrides the default zoom for logos that have no margin of their own.
  const fit = v.logo_scale ? ` style="transform:scale(${v.logo_scale})"` : '';
  return `<span class="logo">${initials}${v.logo ? `<img src="${v.logo}" alt="${t('logoAlt', v.name)}"${fit} onerror="this.remove()">` : ''}</span>`;
}

    : v.simulated
      ? `<div class="none demo"><span>${t('demoData')}</span></div>`
      : `<div class="none">${live ? t('noFramesToday') : v.coming_soon ? t('soon') : t('noCamera')}</div>`;
  const stat = v.latest
    ? `<b>${v.latest.people}</b><span>${t('people')} · ${hm(v.latest.timestamp)}</span>`
    : `<b style="color:var(--muted)">—</b><span>${t('people')}</span>`;
  const lv = v.latest ? levelOf(v.latest.people) : null;
  const closed = v.status?.state === 'closed';
  return `<a class="venue${closed ? ' is-closed' : ''}" href="venue.html?mekan=${v.id}"${lv && !closed ? ` style="--lv:${lv.color}"` : ''}>
    <div class="media" style="position:relative">${media}${statusChip(v)}${logoHtml(v)}</div>
    <div class="body">
      <div class="top"><span class="name">${v.name}</span><span class="type">${typeName(v.type)}</span></div>
      ${statusLine(v, live)}
      <div class="stat">${stat}<span class="arrow">›</span></div>
      ${v.rising ? `<div class="rising">${RISE_ICON}${t('rising')}</div>` : ''}
      <div class="updated"><span title="${v.updatedAt ? v.updatedAt.replace('T', ' ') : ''}">${live ? t('lastUpdate', ago(v.updatedAt)) : v.coming_soon ? t('soonCamera') : t('noUpdates')}</span><button class="gear" data-settings="${v.id}" aria-label="${t('settingsFor', v.name)}">${GEAR_ICON}</button></div>
    </div>
  </a>`;
}

// ---- Venue settings (opening hours + description) ----
let editing = null;
$('grid').addEventListener('click', e => {
  const btn = e.target.closest('[data-settings]');
  if (!btn) return;
  e.preventDefault(); e.stopPropagation();
  const v = lastCards.find(c => c.id === btn.dataset.settings);
  editing = v.id;
  $('setTitle').textContent = v.name;
  $('setAlways').checked = !v.hours;
  $('setOpen').value = v.hours?.open || '10:00';
  $('setClose').value = v.hours?.close || '23:00';
  $('setDesc').value = v.description || '';
  syncAlways();
  $('settings').showModal();
});
const syncAlways = () => { $('setOpen').disabled = $('setClose').disabled = $('setAlways').checked; };
$('setAlways').onchange = syncAlways;
$('setCancel').onclick = () => $('settings').close();
$('settingsForm').onsubmit = e => {
  e.preventDefault();
  const hours = $('setAlways').checked ? null : { open: $('setOpen').value, close: $('setClose').value };
  saveVenueSettings(editing, hours, $('setDesc').value.trim());
  $('settings').close();
  load();
};

setInterval(() => load().catch(() => {}), 60000);
load().catch(() => {
  $('subtitle').hidden = false;
  $('subtitle').textContent = t('readError');
});
</script>
</body>
</html>
