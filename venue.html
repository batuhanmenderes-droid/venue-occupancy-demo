<html lang="tr">
<head>
<meta charset="utf-8">

<style>
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --series: #2a78d6; --series-soft: rgba(42,120,214,0.10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --series: #3987e5; --series-soft: rgba(57,135,229,0.14);
  }
}
:root[data-theme="dark"] {
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --series: #3987e5; --series-soft: rgba(57,135,229,0.14);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1120px; margin: 0 auto; padding: 28px 16px 48px; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; margin-bottom: 20px; }
h1 { font-size: 24px; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--ink-2); margin: 2px 0 0; }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); text-decoration: none; font-size: 13px; border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px 4px 8px; margin-bottom: 12px; }
.back:hover { color: var(--ink); border-color: var(--axis); }
.empty { color: var(--muted); font-size: 13px; padding: 24px 0; text-align: center; }
.placeholder { width: 100%; aspect-ratio: 4 / 3; border-radius: 8px; border: 1px dashed var(--axis); display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; padding: 16px; }
.actions { display: flex; gap: 8px; align-items: center; }
select { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; }
.pill { font-size: 12px; color: var(--ink-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
.tile .label { color: var(--ink-2); font-size: 13px; }
.tile .value { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
.tile .meta { color: var(--muted); font-size: 12px; }
.grid2 { display: grid; grid-template-columns: 1.5fr 1fr; gap: 12px; margin-bottom: 12px; }
h2 { font-size: 15px; margin: 0 0 2px; }
.hint { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); white-space: nowrap; transform: translate(-50%, -110%); display: none; }
.tip b { font-size: 14px; }
.frame img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; display: block; background: #000; }
.frame .row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; }
.frame .count { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.frame .note { color: var(--ink-2); font-size: 13px; min-height: 1.4em; margin-top: 4px; }
.nav { display: flex; gap: 6px; }
button { font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--axis); }
.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.thumb { border: 2px solid transparent; border-radius: 8px; padding: 0; overflow: hidden; text-align: left; background: var(--surface); }
.thumb img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
.thumb span { display: flex; justify-content: space-between; padding: 4px 6px; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.thumb span b { color: var(--ink); }
.thumb[aria-current="true"] { border-color: var(--series); }
details { margin-top: 12px; }
summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
th { color: var(--ink-2); font-weight: 500; }
td.n { text-align: right; }
footer { color: var(--muted); font-size: 12px; margin-top: 16px; }
@media (max-width: 820px) {
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .grid2 { grid-template-columns: 1fr; }
}
</style>

<body>
<main class="venuepage">
  <header class="vhead">
    <a class="back" href="./" data-i18n="back">‹ Venues</a>
    <div class="vtitle">
      <span class="vlogo" id="vlogo"></span>
      <div>
        <div class="vname"><h1 id="title"></h1><span class="stars small" id="vstars"></span></div>
        <p class="vupdated" id="updated"></p>
        <p class="vhours" id="about"></p>
      </div>
      <a class="directions" id="directions" target="_blank" rel="noopener" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 21.5 12 12 21.5 2.5 12z" fill="currentColor"/><path d="M9 14v-2.5a1.5 1.5 0 0 1 1.5-1.5H15m-2-2 2 2-2 2" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="getDirections">Get directions</span></a>
    </div>
    <p class="sub" id="subtitle" hidden></p>
  </header>

  <nav class="vtabs" role="tablist">
    <button role="tab" data-vtab="density" data-i18n="tabDensity">Density</button>
    <button role="tab" data-vtab="calendar" data-i18n="tabCalendar">Activity calendar</button>
    <button role="tab" data-vtab="menu" data-i18n="tabMenu">Menu</button>
    <button role="tab" data-vtab="website" data-i18n="tabWebsite">Website</button>
  </nav>

  <section id="tab-density" role="tabpanel">
    <section class="tiles" id="tiles"></section>
    <div class="card chartcard">
      <div class="chead"><h2 data-i18n="chartTitle"></h2><span class="daylabel" id="dayLabel"></span></div>
      <p class="hint" data-i18n="chartHint"></p>
      <div class="chart" id="chart"><div class="tip" id="tip"></div></div>
      <div class="dayslider">
        <input type="range" id="daySlider" min="0" max="0" step="1" data-i18n-aria="day">
        <div class="dayticks" id="dayTicks"></div>
      </div>
    </div>
    <div class="card chartcard seasoncard">
      <div class="chead"><h2 data-i18n="seasonTitle"></h2><span class="daylabel" id="seasonSummary"></span></div>
      <p class="hint" data-i18n="seasonHint"></p>
      <div class="chart" id="seasonChart"><div class="tip" id="seasonTip"></div></div>
      <div class="slegend" id="seasonLegend"></div>
    </div>
    <section class="grid2 lower">
      <div class="card">
        <h2 data-i18n="tableView"></h2>
        <div class="tablewrap"><table><thead><tr><th data-i18n="thTime"></th><th data-i18n="thPeople"></th><th data-i18n="thNote"></th></tr></thead><tbody id="rows"></tbody></table></div>
      </div>
      <div class="card frame">
        <h2 data-i18n="selectedFrame"></h2>
        <p class="hint" id="frameTime">&nbsp;</p>
        <div class="frameimg"><img id="frameImg" alt=""></div>
        <div class="row"><div><span class="count" id="frameCount"></span> <span style="color:var(--ink-2)" data-i18n="people"></span></div></div>
        <div class="note" id="frameNote"></div>
      </div>
    </section>
  </section>

  <section id="tab-calendar" role="tabpanel" hidden>
    <div class="card">
      <h2 data-i18n="programTitle"></h2>
      <p class="hint" data-i18n="programHint"></p>
      <div class="program" id="program"></div>
    </div>
    <div class="card progchart">
      <h2 data-i18n="programChartTitle"></h2>
      <p class="hint" data-i18n="programChartHint"></p>
      <div class="plegend" id="plegend"></div>
      <div class="chart" id="pchart"><div class="tip" id="ptip"></div></div>
    </div>
  </section>

  <section id="tab-menu" role="tabpanel" hidden>
    <div class="card">
      <h2 data-i18n="menuTitle"></h2>
      <p class="hint" data-i18n="menuHint"></p>
      <div class="menu" id="menu"></div>
    </div>
  </section>

  <section id="tab-website" role="tabpanel" hidden>
    <div class="card webcard" id="web"></div>
  </section>

  <footer id="source"></footer>
</main>

<script>
const $ = id => document.getElementById(id);
const hm = ts => ts.slice(11, 16);
const hms = ts => ts.slice(11, 19);
const params = new URLSearchParams(location.search);
// Business day: frames before 06:00 belong to the previous day, so a night that runs past midnight stays on one page.
const dayOf = f => {
  const d = new Date(f.timestamp);
  if (d.getHours() < 6) d.setDate(d.getDate() - 1);
  return localDay(d);
};
const localDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => dayOf({ timestamp: new Date() });
// everything = every frame of the venue; all = the selected day's frames;
// frames = the selected day's frames whose timestamp has already passed.
let venue = null, countRule = '', everything = [], all = [], frames = [], days = [], current = 0, points = [], day = '', updatedAt = '', dataUrl = '';

// Floor area used for the people-per-m² estimate when a venue has no `area_m2` of its own.
const AREA_BY_TYPE = { Kulüp: 400, Pub: 160, Bar: 140, Meyhane: 160, Restoran: 220, Kafe: 120, Spor: 250, Otel: 300, Plaj: 15000 };

function ago(ts) {
  if (!ts) return t('agoNone');
  const min = Math.floor((Date.now() - new Date(ts)) / 60000);
  if (min < 1) return t('agoNow');
  if (min < 60) return t('agoMin', min);
  if (min < 1440) return t('agoHour', Math.floor(min / 60));
  return t('agoDay', Math.floor(min / 1440));
}

// ?saat=14:30 shows the selected day as it would look at that time.
function now() {
  const q = params.get('saat');
  if (q) {
    const at = new Date(`${day}T${q.length === 5 ? q + ':00' : q}`);
    if (at.getHours() < 6) at.setDate(at.getDate() + 1);
    return at;
  }
  return new Date();
}

function setDay(d) {
  day = d;
  all = everything.filter(f => dayOf(f) === day);
  frames = []; points = []; current = 0;
  params.set('gun', day);
  history.replaceState(null, '', `?${params}`);
  syncSlider();
  refresh(true);
}

// ---- Day timeline slider ----
function renderDays() {
  days = [...new Set([...everything.map(dayOf), today()])].sort();
  if (!days.includes(day)) { days.push(day); days.sort(); }
  const s = $('daySlider');
  s.max = days.length - 1;
  // With many days, label every other one (today always) so the ticks stay readable.
  const every = days.length > 8 ? 2 : 1, n = days.length;
  $('dayTicks').innerHTML = days.map((d, i) => `<span>${d === today() ? t('today') : (n - 1 - i) % every === 0 ? fmtDay(d) : ''}</span>`).join('');
  syncSlider();
}
const fmtDay = d => new Date(`${d}T12:00:00`).toLocaleDateString(LANG === 'tr' ? 'tr-TR' : 'en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
function syncSlider() {
  const i = days.indexOf(day);
  if (i >= 0) $('daySlider').value = i;
  $('dayLabel').textContent = day === today() ? `${t('today')} · ${fmtDay(day)}` : fmtDay(day);
  $('dayTicks').querySelectorAll('span').forEach((el, j) => el.classList.toggle('on', j === i));
}
$('daySlider').oninput = e => setDay(days[+e.target.value]);

// ---- Header ----
function showHeader(v) {
  const st = venueStatus(v);
  const hours = v.hours ? t('hoursLine', v.hours.open, v.hours.close) : t('alwaysLine');
  const state = st.state === 'closed' ? ` · ${t('closed')}` : st.state === 'closing' ? ` · ${t('closingSoon')}` : '';
  $('about').textContent = `${hours}${state}${v.description ? ` · ${v.description}` : ''}`;
  $('updated').textContent = v.coming_soon ? t('soon') : updatedAt ? t('lastUpdate', ago(updatedAt)) : t('noUpdates');
  $('vlogo').innerHTML = v.logo ? `<img src="${v.logo}" alt=""${v.logo_scale ? ` style="transform:scale(${v.logo_scale});clip-path:none"` : ''}>` : '';
}

let simVenue = null;
async function reload() {
  let data;
  if (simVenue) {
    // Demo venue: build two weeks of 40-minute frames (so 'vs last week' has a match) instead of reading a data file.
    const out = [];
    for (let k = 13; k >= 0; k--) {
      const d = new Date(`${today()}T12:00:00`); d.setDate(d.getDate() - k);
      out.push(...simFrames(simVenue, localDay(d)));
    }
    data = { frames: out, updated_at: simLatest(simVenue).timestamp };
    $('source').textContent = t('demoNote');
  } else {
    data = await (await fetch(`${dataUrl}?t=${Date.now()}`)).json();
    $('source').textContent = t('source');
  }
  updatedAt = data.updated_at || '';
  showHeader(venue);
  const before = everything.length;
  everything = data.frames;
  if (!day) day = params.get('gun') || today();
  renderDays();
  renderCalendar();
  if (everything.length !== before) setDay(day); else refresh();
}

function refresh(force) {
  const at = now();
  const due = all.filter(f => new Date(f.timestamp) <= at);
  const followLatest = current >= frames.length - 1;
  const changed = due.length !== frames.length;
  frames = due;
  renderTiles();
  if (!changed && points.length && !force) return;
  renderRows();
  renderChart();
  renderSeasons();
  if (frames.length) select(followLatest ? frames.length - 1 : current); else clearFrame();
}

// ---- Tabs ----
function showVTab(name) {
  for (const k of ['density', 'calendar', 'menu', 'website']) {
    $(`tab-${k}`).hidden = k !== name;
    document.querySelector(`[data-vtab="${k}"]`).setAttribute('aria-selected', k === name);
  }
  params.set('tab', name); history.replaceState(null, '', `?${params}`);
  if (name === 'density') { renderChart(); renderSeasons(); }
  if (name === 'calendar') renderProgramChart();
  if (name === 'website') renderWebsite();
  if (name === 'menu') renderMenu();
}
document.querySelector('.vtabs').onclick = e => { const b = e.target.closest('[data-vtab]'); if (b) showVTab(b.dataset.vtab); };

async function load() {
  const id = params.get('mekan') || 'lemongrass-cafe';
  const { venues } = await (await fetch(`data/venues.json?t=${Date.now()}`)).json();
  const found = venues.find(v => v.id === id);
  if (!found) { location.replace('./'); return; }
  venue = withSettings(found);
  document.title = `${venue.name} · ${t('occupancy')}`;
  $('title').textContent = venue.name;
  // Optional page background (blurred, under a 90% black veil); panels turn to glass over it.
  if (venue.background) {
    document.body.insertAdjacentHTML('afterbegin', `<div class="vbg" aria-hidden="true" style="background-image:url('${venue.background}')"></div>`);
    document.body.classList.add('has-bg'); THEME_PIN = 'dark'; applyTheme();
  }
  // Optional background video (the venue's own YouTube clip, muted and looping), same blur and veil;
  // the video's thumbnail shows until it starts.
  if (venue.background_video?.youtube) {
    const { youtube: id, start = 0 } = venue.background_video;
    const src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&loop=1&playlist=${id}&controls=0&rel=0&iv_load_policy=3&modestbranding=1&playsinline=1&disablekb=1&start=${start}`;
    document.body.insertAdjacentHTML('afterbegin', `<div class="vbg vbg-video" aria-hidden="true" style="background-image:url('https://i.ytimg.com/vi/${id}/hqdefault.jpg')"><iframe src="${src}" title="" tabindex="-1" allow="autoplay; encrypted-media" frameborder="0"></iframe></div>`);
    document.body.classList.add('has-bg'); THEME_PIN = 'dark'; applyTheme();
  }
  // Directions open Google Maps with a route from the viewer's current location to the venue.
  if (venue.location) {
    $('directions').href = `https://www.google.com/maps/dir/?api=1&destination=${venue.location.lat},${venue.location.lon}`;
    $('directions').hidden = false;
  }
  showHeader(venue);
  showVTab(['density', 'calendar', 'menu', 'website'].includes(params.get('tab')) ? params.get('tab') : 'density');
  addEventListener('resize', () => { renderChart(); renderProgramChart(); renderSeasons(); });
  if (venue.simulated) simVenue = venue;
  else if (venue.data) { dataUrl = venue.data; countRule = localized(venue, 'count_rule'); }
  else { renderEmpty(); return; }
  await reload();
  setInterval(() => reload().catch(() => {}), 60000);
}
load().catch(() => { $('subtitle').hidden = false; $('subtitle').textContent = t('readError'); });

// A venue with no camera and no demo data: same layout, every value blank.
function renderEmpty() {
  renderTiles();
  renderChart();
  renderSeasons();
  renderCalendar();
  $('rows').innerHTML = `<tr><td colspan="3" class="empty">${t('noData')}</td></tr>`;
  clearFrame(venue.coming_soon ? t('soonPlaceholder') : t('noFramesVenue'));
}

// ---- Density tiles ----
function stars(score) {  // score 0..5 in half steps
  return Array.from({ length: 5 }, (_, i) => {
    const fill = Math.max(0, Math.min(1, score - i));
    return `<span class="star" style="--fill:${fill * 100}%"></span>`;
  }).join('');
}
const PERSON = '<svg class="tperson" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="4.6" r="2.9" fill="currentColor"/><path d="M2.6 14.4c0-3.1 2.4-5.4 5.4-5.4s5.4 2.3 5.4 5.4z" fill="currentColor"/></svg>';
const ALERT = '<svg class="talert" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M8 4.2v4.6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><circle cx="8" cy="11.4" r="1.05" fill="#fff"/></svg>';
const bigNum = (n, icon = PERSON) => `<span class="bignum">${n}</span>${icon}`;
// Only the top level is called out, with a warning sign.
const veryCrowded = n => LEVELS.indexOf(levelOf(n)) === LEVELS.length - 1 ? `<span class="alertchip">${ALERT}${LEVELS[LEVELS.length - 1].name}</span>` : '';
// "+12 in the last hour" — latest frame against the oldest frame 30–90 minutes earlier.
function hourDelta() {
  const last = frames[frames.length - 1], tl = new Date(last.timestamp).getTime();
  const back = frames.find(f => { const m = (tl - new Date(f.timestamp)) / 60000; return m >= 30 && m <= 90; });
  return back ? last.people - back.people : null;
}
const deltaChip = (d, label) => d === null ? `<span class="delta none">${label}</span>`
  : `<span class="delta ${d > 0 ? 'up' : d < 0 ? 'down' : ''}">${d > 0 ? '▲' : d < 0 ? '▼' : '•'} ${d > 0 ? '+' : ''}${d.toLocaleString()} ${label}</span>`;
// Faint line of the day's counts behind the Busiest tile.
function sparkline() {
  if (frames.length < 2) return '';
  const W = 300, H = 120, max = Math.max(...frames.map(f => f.people)) || 1;
  const pts = frames.map((f, i) => [i / (frames.length - 1) * W, H - 8 - f.people / max * (H - 24)]);
  const line = pts.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`).join('');
  return `<svg class="tspark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="sparkFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--series);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--series);stop-opacity:0"/></linearGradient></defs>
    <path d="${line}L${W},${H}L0,${H}Z" fill="url(#sparkFade)"/><path d="${line}" fill="none" stroke="var(--series)" stroke-width="1.5" vector-effect="non-scaling-stroke" opacity=".45"/></svg>`;
}
// A small vertical bar chart on the right of a tile: [{ v, label, now }], the `now` bar highlighted.
function tileBars(items) {
  const max = Math.max(1, ...items.map(i => i.v ?? 0));
  const bar = ({ v, label, now }) => `<div class="wb ${now ? 'now' : 'prev'}"><b>${v ?? '—'}</b><span class="wbar" style="height:${v === null ? 0 : Math.max(4, v / max * 100)}%"></span><em>${label}</em></div>`;
  return `<div class="weekbars n${items.length}" aria-hidden="true">${items.map(bar).join('')}</div>`;
}
// The last three on-the-hour readings: for each of the last three hours, the frame nearest its start.
function hourlyReadings() {
  const last = new Date(frames[frames.length - 1].timestamp);
  const out = [];
  for (let k = 2; k >= 0; k--) {
    const h = new Date(last); h.setMinutes(0, 0, 0); h.setHours(h.getHours() - k);
    const near = frames.reduce((a, f) => Math.abs(new Date(f.timestamp) - h) < Math.abs(new Date(a.timestamp) - h) ? f : a);
    const ok = Math.abs(new Date(near.timestamp) - h) <= 45 * 60000;
    out.push({ v: ok ? near.people : null, label: `${String(h.getHours()).padStart(2, '0')}:00`, now: k === 0 });
  }
  return out;
}
// People per m²: 40 cells (each ≈ 1 m²), as many filled as there are people per 40 m².
function m2Grid(density) {
  const filled = Math.min(40, Math.round(density * 40));
  return `<div class="m2grid" aria-hidden="true">${Array.from({ length: 40 }, (_, i) => `<i${i < filled ? ' class="on"' : ''}></i>`).join('')}</div>`;
}
function renderTiles() {
  const dash = '<span class="bignum" style="color:var(--muted)">—</span>';
  const area = venue?.area_m2 || AREA_BY_TYPE[venue?.type] || 150;
  const tile = (l, v, m, extra = '', cls = '') => `<div class="card tile${cls}">${extra}<div class="label">${l}</div><div class="value">${v}</div><div class="meta">${m}</div></div>`;
  if (!frames.length) {
    $('tiles').innerHTML = [tile(t('tileLastMeasure'), dash, ''), tile(t('tileRecord'), dash, ''), tile(t('tilePerM2'), dash, t('perM2Meta', area))].join('');
    $('vstars').innerHTML = '';
    return;
  }
  const last = frames[frames.length - 1];
  const peak = Math.max(...frames.map(f => f.people));
  const peakTimes = frames.filter(f => f.people === peak).map(f => hm(f.timestamp));
  const avg = frames.reduce((s, f) => s + f.people, 0) / frames.length;
  const best = everything.filter(f => new Date(f.timestamp) <= new Date()).reduce((a, f) => f.people > (a?.people ?? -1) ? f : a, null);
  // All-time high: the venue's stored `record`, otherwise the busiest week of its weekly history
  // since 2021 (demo data, see weeklyHistory), never below the busiest frame we actually have.
  const hist = weeklyHistory();
  const histTop = hist.reduce((a, w) => w.people > (a?.people ?? -1) ? w : a, null);
  let record = venue.record ? { people: venue.record.people, timestamp: venue.record.at }
    : histTop ? { people: histTop.people, timestamp: localIso(histTop.at) } : null;
  if (best && (!record || best.people > record.people)) record = best;
  const recordDelta = record ? peak - record.people : null;
  // Average busiest frame per day across every day we have (including today).
  const byDay = {};
  for (const f of everything) if (new Date(f.timestamp) <= new Date()) byDay[dayOf(f)] = Math.max(byDay[dayOf(f)] ?? 0, f.people);
  const dayPeaks = Object.values(byDay);
  const avgPeak = dayPeaks.length ? Math.round(dayPeaks.reduce((a, b) => a + b, 0) / dayPeaks.length) : null;
  // Popularity: where the day's peak and average sit on the five crowd levels, as 1–5 stars in half steps.
  const lvl = n => LEVELS.indexOf(levelOf(n));
  const score = Math.round((1 + (lvl(peak) * 0.6 + lvl(Math.round(avg)) * 0.4)) * 2) / 2;
  const density = last.people / area;
  $('tiles').innerHTML = [
    tile(t('tileLastMeasure'), bigNum(last.people), `${veryCrowded(last.people)}${deltaChip(hourDelta(), t('lastHour'))}`, tileBars(hourlyReadings()), ' has-bars stacked'),
    tile(t('tileRecord'), bigNum(record.people), `${veryCrowded(record.people)}${deltaChip(recordDelta, t('todayVsRecord'))}`,
      tileBars([{ v: record.people, label: t('recordShort') }, { v: avgPeak, label: t('avgShort') }, { v: peak, label: t('today'), now: true }]), ' has-bars stacked'),
    tile(t('tilePerM2'), `${bigNum(decimal(density < 0.1 ? density.toFixed(3) : density.toFixed(2)), '<span class="tunit">/ m²</span>')}`, `${m2Grid(density)}<span class="tmeta">${t('perM2Meta', area)}</span>`),
  ].join('');
  // Popularity sits next to the venue name as small stars.
  $('vstars').innerHTML = stars(score);
  $('vstars').setAttribute('aria-label', `${t('tilePopularity')} ${score} / 5`);
  $('vstars').title = `${t('tilePopularity')} · ${decimal(score.toFixed(1))} / 5 · ${t('popularityMeta')}`;
}

// ---- Activity calendar: a weekly programme, a different artist each night ----
// Demo line-up for entertainment venues. Each artist plays a set inside 21:00–01:00; the expected
// crowd builds before the set, peaks during it and thins after.
const ARTISTS = [
  { name: 'Deniz Sipahi', set: ['21:00', '22:30'], peak: 0.78 },
  { name: 'Fırat Akarsel', set: ['21:30', '23:00'], peak: 0.86 },
  { name: 'OA Music', set: ['22:00', '23:30'], peak: 0.7 },
  { name: 'Jabbar', set: ['22:30', '00:00'], peak: 0.95 },
  { name: 'Deeperrise', set: ['23:00', '00:30'], peak: 1 },
  { name: 'Emre Koca', set: ['23:30', '01:00'], peak: 0.9 },
];
// Categorical series colours (fixed order, validated palette; dark-mode steps follow the theme).
const SERIES = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#6250d6'];
const SERIES_DARK = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#9085e9'];
const seriesColor = i => (document.documentElement.dataset.theme === 'dark' ? SERIES_DARK : SERIES)[i];
const PROGRAM_TYPES = ['Kulüp', 'Bar', 'Pub', 'Meyhane'];
const minOf = hhmm => { const [h, m] = hhmm.split(':').map(Number); return (h < 12 ? h + 24 : h) * 60 + m; };  // 01:00 → 25:00

// The coming seven days starting today; six artists, rotated per venue, and one quiet night.
function weekProgram() {
  const off = [...(venue?.id || '')].reduce((a, c) => a + c.charCodeAt(0), 0);
  return Array.from({ length: 7 }, (_, k) => {
    const d = new Date(`${today()}T12:00:00`); d.setDate(d.getDate() + k);
    const slot = (k + off) % 7;
    return { day: localDay(d), artist: slot < 6 ? slot : null };
  });
}
// Expected crowd (% of capacity) at minute m for an artist: rises into the set, holds, then fades.
function expected(a, m) {
  const s0 = minOf(a.set[0]), s1 = minOf(a.set[1]);
  const before = 1 / (1 + Math.exp(-(m - (s0 - 20)) / 14));
  const after = 1 / (1 + Math.exp((m - (s1 + 15)) / 16));
  return Math.round(100 * a.peak * (0.18 + 0.82 * before * after));
}

function renderCalendar() {

function renderProgramChart() {
  const box = $('pchart');
  if (!box.clientWidth) return;
  const W = Math.max(300, box.clientWidth), H = Math.round(Math.min(340, Math.max(240, W * 0.32)));
  const m = { t: 12, r: 16, b: 26, l: 44 };
  const m0 = minOf('21:00'), m1 = minOf('01:00');
  const steps = Array.from({ length: (m1 - m0) / 10 + 1 }, (_, i) => m0 + i * 10);
  const x = v => m.l + (v - m0) / (m1 - m0) * (W - m.l - m.r);
  const y = v => H - m.b - v / 100 * (H - m.t - m.b);
  const clock = v => `${String(Math.floor(v / 60) % 24).padStart(2, '0')}:${String(v % 60).padStart(2, '0')}`;
  let g = '';
  for (let v = 0; v <= 100; v += 25) {
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--${v ? 'grid' : 'axis'})" stroke-width="1"/>`;
    g += `<text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${v}%</text>`;
  }
  for (let v = m0; v <= m1; v += 30) g += `<text x="${x(v)}" y="${H - 6}" text-anchor="middle">${clock(v)}</text>`;
  ARTISTS.forEach((a, i) => {
    const d = steps.map((v, j) => `${j ? 'L' : 'M'}${x(v)},${y(expected(a, v))}`).join('');
    g += `<path d="${d}" fill="none" stroke="${seriesColor(i)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  g += `<line id="pcross" y1="${m.t}" y2="${H - m.b}" stroke="var(--axis)" stroke-width="1" visibility="hidden"/>`;
  g += `<rect x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/>`;
  box.querySelector('svg')?.remove();
  box.insertAdjacentHTML('afterbegin', `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('programChartTitle')}">${g}</svg>`);
  const svg = box.querySelector('svg'), tip = $('ptip'), cross = $('pcross');
  svg.onmousemove = e => {
    const r = svg.getBoundingClientRect(), k = r.width / W, px = (e.clientX - r.left) / k;
    const v = steps.reduce((a, b) => Math.abs(x(b) - px) < Math.abs(x(a) - px) ? b : a);
    cross.setAttribute('x1', x(v)); cross.setAttribute('x2', x(v)); cross.setAttribute('visibility', 'visible');
    const rows = ARTISTS.map((a, i) => ({ a, i, n: expected(a, v) })).sort((p, q) => q.n - p.n);
    tip.innerHTML = `<div class="ptime">${clock(v)}</div>` + rows.map(({ a, i, n }) => `<div class="prow"><i style="background:${seriesColor(i)}"></i>${a.name}<b>${n}%</b></div>`).join('');
    tip.style.left = `${Math.min(x(v) * k, r.width - 110)}px`; tip.style.top = `${m.t * k + 10}px`; tip.style.display = 'block';
  };
  svg.onmouseleave = () => { tip.style.display = 'none'; cross.setAttribute('visibility', 'hidden'); };
}

// ---- Chart ----
// ---- Weekly history since 2021 (demo data) ----
// One value per week (Monday): the busiest moment of that week. Shaped by the venue type's season
// (summer tourism for bars and the beach, winter / spring for the gym), year-on-year growth after the
// 2021 restrictions, bayram holiday weeks, the New Year's week and weekly noise. It is scaled so the
// current week matches what the cameras see now, and a stored `record` lands on its own week.
const SEASON_SHAPE = {
  //          Jan   Feb   Mar   Apr   May   Jun   Jul   Aug   Sep   Oct   Nov   Dec
  night:    [0.30, 0.28, 0.32, 0.40, 0.55, 0.80, 1.00, 1.00, 0.78, 0.55, 0.36, 0.40],
  food:     [0.38, 0.36, 0.42, 0.52, 0.66, 0.85, 1.00, 0.98, 0.82, 0.62, 0.44, 0.42],
  beach:    [0.02, 0.02, 0.05, 0.18, 0.45, 0.80, 1.00, 1.00, 0.85, 0.50, 0.12, 0.03],
  gym:      [0.95, 1.00, 0.95, 0.90, 0.88, 0.80, 0.70, 0.68, 0.85, 0.90, 0.88, 0.80],
  hotel:    [0.20, 0.20, 0.28, 0.45, 0.70, 0.90, 1.00, 1.00, 0.85, 0.55, 0.25, 0.22],
};
const shapeOf = v => v.sim_profile === 'beach' || v.type === 'Plaj' ? 'beach' : v.type === 'Spor' ? 'gym' : v.type === 'Otel' ? 'hotel'
  : ['Restoran', 'Kafe'].includes(v.type) ? 'food' : 'night';
// 2023 was the peak year everywhere; every year since has been a little quieter.
const YEAR_GROWTH = { 2021: 0.62, 2022: 0.84, 2023: 1, 2024: 0.9, 2025: 0.81, 2026: 0.73 };
const BAYRAMS = ['2021-05-13', '2021-07-20', '2022-05-02', '2022-07-09', '2023-04-21', '2023-06-28', '2024-04-10', '2024-06-16', '2025-03-30', '2025-06-06', '2026-03-20', '2026-05-27'];
const mondayOf = d => { const m = new Date(d.getFullYear(), d.getMonth(), d.getDate()); m.setDate(m.getDate() - (m.getDay() + 6) % 7); return m; };
const seasonOf = d => [0, 0, 1, 1, 1, 2, 2, 2, 3, 3, 3, 0][d.getMonth()];  // winter, spring, summer, autumn
let histCache = null;
function weeklyHistory() {
  if (histCache?.id === venue.id) return histCache.weeks;
  const shape = SEASON_SHAPE[shapeOf(venue)];
  const now = new Date(), end = mondayOf(now);
  const weeks = [];
  for (let d = mondayOf(new Date(2021, 0, 4)); d <= end; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 7)) {
    // Month shape, eased between neighbouring months by the day of the month.
    const mo = d.getMonth(), f = (d.getDate() - 1) / 31, nxt = shape[(mo + 1) % 12];
    let v = shape[mo] * (1 - f * 0.5) + nxt * f * 0.5;
    v *= YEAR_GROWTH[d.getFullYear()] ?? 1;
    // 2021: closures until June, then a strong reopening summer.
    if (d < new Date(2021, 5, 1)) v *= d < new Date(2021, 4, 17) ? 0.25 : 0.5;
    const iso = localIso(d).slice(0, 10), wkEnd = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 7);
    if (BAYRAMS.some(b => { const x = new Date(b); return x >= d && x < wkEnd; })) v *= 1.18;
    if (mo === 11 && d.getDate() >= 25) v *= shapeOf(venue) === 'night' ? 1.45 : 1.15;   // New Year's week
    const r1 = simRandom(`${venue.id}:wk:${iso}`), r2 = simRandom(`${venue.id}:wk2:${iso}`);
    v *= 0.86 + r1 * 0.28;                     // ordinary week-to-week swing
    if (r2 < 0.06) v *= 0.6;                   // a rainy or windy week
    if (r2 > 0.97) v *= 1.22;                  // a special event
    weeks.push({ at: d, raw: v });
  }
  // Keep 2023 the top year: earlier years stay below it, and each later year's high stays below
  // the year before (whole years are scaled down when noise or an event would break that).
  const yearTop = y => Math.max(0, ...weeks.filter(w => w.at.getFullYear() === y).map(w => w.raw));
  const scaleYear = (y, cap) => { const top = yearTop(y); if (top > cap) weeks.forEach(w => { if (w.at.getFullYear() === y) w.raw *= cap / top; }); };
  const peakYear = yearTop(2023);
  for (const y of [2021, 2022]) scaleYear(y, peakYear * 0.92);
  for (let y = 2024; y <= now.getFullYear(); y++) scaleYear(y, yearTop(y - 1) * 0.93);
  // Scale: the current week matches the venue's busiest frame this week (cameras or demo data).
  const thisWeek = everything.filter(f => new Date(f.timestamp) >= end && new Date(f.timestamp) <= now);
  const nowPeak = thisWeek.length ? Math.max(...thisWeek.map(f => f.people)) : null;
  const last = weeks[weeks.length - 1];
  // The floor keeps off-season weeks from blowing up the scale; the beach is sized to its capacity
  // (its demo days run 1000–1200 all year, so the current week says nothing about the season).
  let k = shapeOf(venue) === 'beach' ? 1350 / peakYear : nowPeak ? nowPeak / Math.max(last.raw, peakYear * 0.35) : 40;
  if (venue.record) {
    // A stored record is the top: the record week holds it and the rest is scaled to it.
    const recWeek = mondayOf(new Date(venue.record.at)).getTime();
    const others = Math.max(...weeks.filter(w => w.at.getTime() !== recWeek).map(w => w.raw));
    k = venue.record.people * 0.9 / others;  // the best summers come close to it
    weeks.forEach(w => { w.people = w.at.getTime() === recWeek ? venue.record.people : Math.round(w.raw * k); });
  } else weeks.forEach(w => { w.people = Math.round(w.raw * k); });
  if (nowPeak !== null) last.people = Math.max(last.people, nowPeak);
  // Real camera counts this week can top a quieter past year; then the years between 2023 and now
  // are lifted just enough that each one stays above the next.
  const top = y => Math.max(0, ...weeks.filter(w => w.at.getFullYear() === y).map(w => w.people));
  const ceiling = top(2023);
  for (let y = now.getFullYear() - 1; y >= 2024; y--) {
    const want = Math.round(top(y + 1) * 1.06) + 1, have = top(y);
    if (have < want && want < ceiling) weeks.forEach(w => { if (w.at.getFullYear() === y) w.people = Math.round(w.people * want / have); });
  }
  histCache = { id: venue.id, weeks };
  return weeks;
}

// ---- All-time high by season (weekly, since 2021) ----
const SEASON_COLORS = ['#64b5f6', '#4cd964', '#ffcc00', '#ff8a3d'];
function renderSeasons() {
  const box = $('seasonChart');
  if (!box || !box.clientWidth || !venue) return;
  const weeks = weeklyHistory();
  if (!weeks.length) return;
  const W = Math.max(300, box.clientWidth), H = Math.round(Math.min(300, Math.max(200, W * 0.26)));
  const m = { t: 26, r: 12, b: 26, l: 44 };
  const top = Math.max(...weeks.map(w => w.people));
  const raw = Math.max(10, top) / 5, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const tick = [1, 2, 5, 10].map(k => k * mag).find(k => k >= raw), max = Math.ceil(Math.max(10, top) * 1.08 / tick) * tick;
  const t0 = weeks[0].at.getTime(), t1 = weeks[weeks.length - 1].at.getTime() + 7 * 86400000;
  const x = t => m.l + (t - t0) / (t1 - t0) * (W - m.l - m.r);
  const y = v => H - m.b - v / max * (H - m.t - m.b);
  // Group consecutive weeks into seasons (winter spans the turn of the year).
  const seasons = [];
  for (const w of weeks) {
    const s = seasonOf(w.at), yr = w.at.getMonth() === 11 ? w.at.getFullYear() + 1 : w.at.getFullYear();
    const cur = seasons[seasons.length - 1];
    if (cur && cur.s === s && cur.yr === yr) cur.weeks.push(w); else seasons.push({ s, yr, weeks: [w] });
  }
  const names = t('seasonNames');
  let g = '';
  for (const se of seasons) {
    const a = x(se.weeks[0].at.getTime()), b = x(se.weeks[se.weeks.length - 1].at.getTime() + 7 * 86400000);
    se.top = se.weeks.reduce((p, w) => w.people > p.people ? w : p);
    g += `<rect x="${a}" y="${m.t}" width="${b - a}" height="${H - m.t - m.b}" fill="${SEASON_COLORS[se.s]}" opacity="0.1"/>`;
    // Each season's own high: a short tick and the number above the band when there is room.
    g += `<line x1="${a + 2}" x2="${b - 2}" y1="${y(se.top.people)}" y2="${y(se.top.people)}" stroke="${SEASON_COLORS[se.s]}" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.9"/>`;
    if (b - a > 26) g += `<text class="stop" x="${(a + b) / 2}" y="${m.t - 8}" text-anchor="middle" fill="${SEASON_COLORS[se.s]}">${se.top.people}</text>`;
  }
  for (let v = 0; v <= max; v += tick) {
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--${v ? 'grid' : 'axis'})" stroke-width="1"/>`;
    g += `<text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  }
  for (let yr = 2021; yr <= new Date().getFullYear(); yr++) {
    const tx = x(new Date(yr, 0, 1).getTime());
    if (tx >= m.l - 1) g += `<line x1="${tx}" x2="${tx}" y1="${m.t}" y2="${H - m.b}" stroke="var(--axis)" stroke-width="1" opacity="0.6"/><text x="${tx + 4}" y="${H - 8}">${yr}</text>`;
  }
  const pts = weeks.map(w => ({ w, x: x(w.at.getTime() + 3.5 * 86400000), y: y(w.people) }));
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join('');
  g += `<defs><linearGradient id="seasArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--series)" stop-opacity="0.28"/><stop offset="1" stop-color="var(--series)" stop-opacity="0"/></linearGradient></defs>`;
  g += `<path d="${line}L${pts[pts.length - 1].x},${y(0)}L${pts[0].x},${y(0)}Z" fill="url(#seasArea)"/>`;
  g += `<path d="${line}" fill="none" stroke="var(--series)" stroke-width="1.6" stroke-linejoin="round"/>`;
  // The all-time high, marked and labelled.
  const ath = pts.reduce((a, p) => p.w.people > a.w.people ? p : a);
  g += `<circle cx="${ath.x}" cy="${ath.y}" r="5" fill="#ff375f" stroke="var(--surface)" stroke-width="2"/>`;
  g += `<text class="athlabel" x="${ath.x}" y="${ath.y - 10}" text-anchor="${ath.x > W - 90 ? 'end' : ath.x < 90 ? 'start' : 'middle'}">${t('athLabel')} · ${ath.w.people}</text>`;
  g += `<line id="seasCross" y1="${m.t}" y2="${H - m.b}" stroke="var(--axis)" stroke-width="1" visibility="hidden"/><circle id="seasDot" r="4" fill="var(--series)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>`;
  box.querySelector('svg')?.remove();
  box.insertAdjacentHTML('afterbegin', `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('seasonTitle')}">${g}</svg>`);
  const svg = box.querySelector('svg'), tip = $('seasonTip'), cross = $('seasCross'), dot = $('seasDot');
  const fmt = d => d.toLocaleDateString(LANG === 'tr' ? 'tr-TR' : 'en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  svg.onmousemove = e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width, k = r.width / W;
    const p = pts.reduce((a, b) => Math.abs(b.x - px) < Math.abs(a.x - px) ? b : a);
    cross.setAttribute('x1', p.x); cross.setAttribute('x2', p.x); cross.setAttribute('visibility', 'visible');
    dot.setAttribute('cx', p.x); dot.setAttribute('cy', p.y); dot.setAttribute('visibility', 'visible');
    tip.innerHTML = `${t('weekOf', fmt(p.w.at))} · ${names[seasonOf(p.w.at)]}<br><b>${p.w.people}</b> ${t('people')}`;
    tip.style.left = p.x * k + 'px'; tip.style.top = p.y * k + 'px'; tip.style.display = 'block';
  };
  svg.onmouseleave = () => { tip.style.display = 'none'; cross.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); };
  // Legend: each season's best ever, with the year it happened.
  const bestBy = [0, 1, 2, 3].map(s => seasons.filter(se => se.s === s).reduce((a, se) => !a || se.top.people > a.top.people ? se : a, null));
  $('seasonLegend').innerHTML = bestBy.map((se, s) => se ? `<span><i style="background:${SEASON_COLORS[s]}"></i>${names[s]} <b>${se.top.people}</b> <em>${se.s === 0 ? `${se.yr - 1}–${String(se.yr).slice(2)}` : se.yr}</em></span>` : '').join('');
  $('seasonSummary').textContent = t('athOn', fmt(ath.w.at), ath.w.people);
}

function renderChart() {
  const box = $('chart');
  if (!box.clientWidth) return;
  const W = Math.max(300, box.clientWidth), H = Math.round(Math.min(340, Math.max(220, W * 0.3)));
  const m = { t: 12, r: 12, b: 26, l: 40 };
  const secs = f => { const [h, mi, s] = hms(f.timestamp).split(':').map(Number); return (f.timestamp.slice(0, 10) > day ? 86400 : 0) + h * 3600 + mi * 60 + s; };
  const t0 = Math.min(8 * 3600, all.length ? Math.floor(secs(all[0]) / 3600) * 3600 : Infinity);
  const t1 = Math.max(24 * 3600, all.length ? Math.ceil(secs(all[all.length - 1]) / 3600) * 3600 : 0);
  // A "nice" tick step (1, 2 or 5 × 10ⁿ) giving about five gridlines, whether the peak is 10 or 1,200.
  const peakN = Math.max(10, ...frames.map(f => f.people));
  const raw = peakN / 5, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const tick = [1, 2, 5, 10].map(k => k * mag).find(k => k >= raw);
  const max = Math.ceil(peakN / tick) * tick;
  const x = s => m.l + (s - t0) / (t1 - t0) * (W - m.l - m.r);
  const y = v => H - m.b - v / max * (H - m.t - m.b);
  points = frames.map((f, i) => ({ i, x: x(secs(f)), y: y(f.people) }));
  let g = '';
  for (let v = 0; v <= max; v += tick) {
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--${v ? 'grid' : 'axis'})" stroke-width="1"/>`;
    g += `<text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  }
  for (let h = t0 / 3600; h <= t1 / 3600; h += W < 720 ? 2 : 1)
    g += `<text x="${x(h * 3600)}" y="${H - 6}" text-anchor="middle">${String(h % 24).padStart(2, '0')}:00</text>`;
  if (points.length) {
    const line = points.map((p, i) => `${i ? 'L' : 'M'}${p.x},${p.y}`).join('');
    const area = `${line}L${points[points.length - 1].x},${y(0)}L${points[0].x},${y(0)}Z`;
    // Colour follows height: each crowd level's colour sits at the middle of its band on the y axis.
    const stops = LEVELS.map((l, i) => {
      const lo = i ? LEVELS[i - 1].max + 1 : 0, hi = l.max === Infinity ? Math.max(lo + 20, max) : l.max;
      return [Math.min(1, ((lo + hi) / 2) / max), l.color];
    }).filter(([o], i, arr) => i === 0 || arr[i - 1][0] < 1);
    const grad = (id, op) => `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="0" y1="${y(0)}" x2="0" y2="${y(max)}">${stops.map(([o, c]) => `<stop offset="${o}" stop-color="${c}" stop-opacity="${op}"/>`).join('')}</linearGradient>`;
    g += `<defs>${grad('lvlLine', 1)}${grad('lvlArea', 0.22)}</defs>`;
    g += `<path d="${area}" fill="url(#lvlArea)"/>`;
    g += `<path d="${line}" fill="none" stroke="url(#lvlLine)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  g += `<line id="cross" y1="${m.t}" y2="${H - m.b}" stroke="var(--axis)" stroke-width="1" visibility="hidden"/>`;
  g += points.map(p => `<circle cx="${p.x}" cy="${p.y}" r="4.5" fill="${levelOf(frames[p.i].people).color}" stroke="var(--surface)" stroke-width="2"/>`).join('');
  g += `<circle id="sel" r="7" fill="none" stroke="var(--series)" stroke-width="2"/>`;
  g += `<rect x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent" style="cursor:pointer"/>`;
  box.querySelector('svg')?.remove();
  box.insertAdjacentHTML('afterbegin', `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('chartAria')}">${g}</svg>`);
  const svg = box.querySelector('svg'), tip = $('tip'), cross = $('cross');
  const nearest = e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
    return points.reduce((a, b) => Math.abs(b.x - px) < Math.abs(a.x - px) ? b : a);
  };
  markSelected();
  if (!points.length) return;
  svg.onmousemove = e => {
    const p = nearest(e), f = frames[p.i], r = svg.getBoundingClientRect(), k = r.width / W;
    cross.setAttribute('x1', p.x); cross.setAttribute('x2', p.x); cross.setAttribute('visibility', 'visible');
    tip.innerHTML = `${hms(f.timestamp)}<br><b>${f.people}</b> ${t('people')}`;
    tip.style.left = p.x * k + 'px'; tip.style.top = p.y * k + 'px'; tip.style.display = 'block';
  };
  svg.onmouseleave = () => { tip.style.display = 'none'; cross.setAttribute('visibility', 'hidden'); };
  svg.onclick = e => select(nearest(e).i);
}

function markSelected() {
  const p = points[current], sel = $('sel');
  if (!sel) return;
  sel.setAttribute('visibility', p ? 'visible' : 'hidden');
  if (p) { sel.setAttribute('cx', p.x); sel.setAttribute('cy', p.y); }
}

// ---- Selected frame (blurred so no one can be recognised) ----
function clearFrame(msg) {
  $('frameImg').removeAttribute('src');
  $('frameImg').closest('.frameimg').classList.add('empty');
  $('frameTime').textContent = msg || ' ';
  $('frameCount').textContent = '—';
  $('frameNote').textContent = '';
}
function select(i) {
  if (!frames.length) return;
  current = Math.max(0, Math.min(frames.length - 1, i));
  const f = frames[current];
  const wrap = $('frameImg').closest('.frameimg');
  wrap.classList.remove('empty');
  wrap.classList.toggle('demo', !f.file);
  $('frameImg').src = f.file || 'backgrounds/noise.webp';  // demo frames show TV static
  $('frameImg').alt = t('frameAlt', hms(f.timestamp));
  $('frameTime').textContent = `${fmtDay(dayOf(f))} · ${hms(f.timestamp)} · ${f.camera}`;
  $('frameCount').textContent = f.people;
  const note = localized(f, 'note');
  $('frameNote').innerHTML = `${levelBadge(f.people)}${note ? ' · ' : ''}`;
  $('frameNote').append(note);
  document.querySelectorAll('#rows tr').forEach(r => r.classList.toggle('on', +r.dataset.i === current));
  markSelected();
}
</script>
